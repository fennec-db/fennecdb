[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fennecdb"
version = "0.2.0"
description = "fennecdb over HTTP: a client, and vector stores for LangChain and LlamaIndex"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["fennecdb", "vector", "database", "langchain", "llama-index"]
# The client is the standard library alone, as the server is std alone.
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=1.0"]
llama-index = ["llama-index-core>=0.12"]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "langchain-core>=1.0",
    "langchain-tests>=1.0",
    "llama-index-core>=0.12",
]

[project.urls]
Homepage = "https://fennecdb.com"
Documentation = "https://fennecdb.com/docs/integrations"
Source = "https://github.com/fennec-db/fennecdb"

[tool.setuptools]
packages = ["fennecdb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
