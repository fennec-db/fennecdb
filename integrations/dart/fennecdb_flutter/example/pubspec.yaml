name: fennecdb_flutter_example
description: A todo list kept in a fennecdb file, its list a live query.
publish_to: none
version: 0.2.0

environment:
  sdk: ^3.13.0
  # material_ui's floor: Flutter 3.50 deprecates package:flutter/material.dart for it.
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  fennecdb_flutter:
    path: ../
  material_ui: ^1.11.0
  path_provider: ^2.1.0

# integration_test/: the plugin's library opened in the app itself, which
# CI runs on macOS.
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

dependency_overrides:
  fennecdb:
    path: ../../fennecdb

flutter:
  uses-material-design: true
