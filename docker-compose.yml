# fennecdb -- one version, one file, one writer.
#
#   export FENNEC_HTTP_TOKEN=$(openssl rand -hex 32)
#   docker compose up -d
#   curl -H "Authorization: Bearer $FENNEC_HTTP_TOKEN" -d '{"query": "collections"}' \
#     http://127.0.0.1:8080/query
#
# The token is mandatory, 32 bytes at least (the server listens on 0.0.0.0,
# past loopback, inside the container), and `down`/`ps`/`logs` want it too;
# for lasting use it is easier to keep it in an `.env` file beside this one:
#   echo "FENNEC_HTTP_TOKEN=$(openssl rand -hex 32)" > .env
#
# `replicas` cannot be raised: two processes writing the same file corrupt
# it. Scale vertically, or by tenant (fennec-server --dir behind fennec-shard).

services:
  fennecdb:
    build: .
    image: fennecdb
    container_name: fennecdb

    # Published only on the host's loopback. fennec-server speaks no TLS; put
    # a TLS terminator (nginx, Caddy) in front of it for an open network.
    ports:
      - "127.0.0.1:8080:8080"

    environment:
      # Token required: listening on 0.0.0.0 without one, or with one shorter
      # than 32 bytes, is refused.
      FENNEC_HTTP_TOKEN: "${FENNEC_HTTP_TOKEN:?set a token of 32 bytes or more first, as openssl rand -hex 32 makes}"

    volumes:
      - fennecdata:/data

    # To override the defaults (the whole CMD from the image must be spelled out):
    # command: ["--http", "0.0.0.0:8080", "--file", "/data/data.fennec",
    #           "--sync", "250", "--max-connections", "50",
    #           "--idle-timeout", "300", "--max-memory", "340"]
    #
    # --max-memory is chosen as a third of the mem_limit below: once it is
    # exceeded writes stop with 507, and you get a clean error instead of a
    # cgroup OOM (SIGKILL, lost sync, lost checkpoint).

    # The file is mapped: the documents stay in it, and the process holds
    # what it derived from them. Ceiling: ~3x the derived data on
    # compact/checkpoint. If the limit drops below what it holds the cgroup
    # sends SIGKILL and one --sync interval of writes is lost.
    mem_limit: 1g
    memswap_limit: 1g

    restart: unless-stopped

    # The shutdown signal is caught: first sync, then -- if a vector index
    # exists -- a checkpoint. On a timeout the data is still on disk, only
    # the graph is lost (--no-checkpoint turns it off).
    stop_grace_period: 30s

volumes:
  fennecdata:
