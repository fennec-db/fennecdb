[workspace]
resolver = "2"
members = [
    "crates/fennec-core",
    "crates/fennec-ql",
    "crates/fennec-abi",
    "crates/fennec-wasm",
    "crates/fennec-ffi",
    "crates/fennec-server",
    "crates/fennec-wire",
    "crates/fennec-http",
    "crates/fennec-import",
    "crates/fennec-shard",
    "crates/fennec-cli",
    "crates/fennec-tls",
    "crates/fennec-bench",
]

[workspace.package]
version = "0.1.12"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/fennec-db/fennecdb"
readme = "README.md"
keywords = ["database", "vector", "embedded", "wasm", "http"]
categories = ["database", "database-implementations", "wasm"]

# The internal crates carry a version as well as a path: cargo refuses to
# publish a dependency that has only a path, and keeping them here means a
# release bumps one number instead of seven.
[workspace.dependencies]
# Without its files: fennec-ql and fennec-wasm take the core as it is, and a
# crate that opens files names `std-fs`. Left on here, the `default-features =
# false` those two write was ignored and the browser build had them too.
fennec-core = { version = "0.1.3", path = "crates/fennec-core", default-features = false }
# Without named statements' definitions and calls (`statements`): the browser
# module takes the parser as it is, and the server, the shell and the native
# library name them.
fennec-ql = { version = "0.1.3", path = "crates/fennec-ql", default-features = false }
fennec-abi = { version = "0.1.7", path = "crates/fennec-abi", default-features = false }
fennec-http = { version = "0.1.3", path = "crates/fennec-http" }
fennec-server = { version = "0.1.3", path = "crates/fennec-server" }
# Without TLS (`tls`), which the binaries name: a crate taking either has no
# dependency from outside the workspace unless it asks for one.
fennec-wire = { version = "0.1.12", path = "crates/fennec-wire", default-features = false }
fennec-import = { version = "0.1.3", path = "crates/fennec-import", default-features = false }
# rustls, ring and Mozilla's roots behind a crate of their own: the only
# dependencies from outside the workspace a shipped crate may take
# (docs/design/crates.md#zero-dependencies).
fennec-tls = { version = "0.1.12", path = "crates/fennec-tls" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# `cargo test` builds some 70 binaries, each linked with the whole engine:
# line tables are enough for a backtrace's lines, and the rest of the debug
# information was most of what the linker read and wrote.
[profile.test]
debug = "line-tables-only"

# Small binary for the `fennec` shell: abort instead of panic unwinding.
# The shell is a single process with no scenario for recovering from a panic;
# the unwind tables, meanwhile, take ~12% of the binary. `fennec-server` does *not*
# use this profile: there a panicking connection thread unwinds and only
# drops its own request, leaving the server up.
[profile.cli]
inherits = "release"
panic = "abort"

# The shell reaches fennec-http only for `fennec backup`, `archive` and
# `restore`, which wait on the network and the disk: built for size it is
# 16.3 KB less of the released binary (`make size-report BIN=fennec`). The
# importer stays fast -- built for size it took 32.6 KB off, and a
# 200 000-row SQLite import from 251 to 285 ms -- and so does the root
# crate: built for size it made the binary 129 KB larger.
[profile.cli.package.fennec-http]
opt-level = "z"

# TLS in the shell dials PostgreSQL once an import: built for size, rustls,
# its certificate checks and ring's Rust took 176 KB off `fennec` (3533 ->
# 3357 KB), and a million-row import over verify-full took 2357 ms at the
# median against 2307 built for speed, 2173 in plain text -- the difference
# inside the noise of a loaded machine. ring's ciphers are assembly either
# way. fennec-server, whose --follow and listeners stream through it, keeps
# them at release speed.
[profile.cli.package.rustls]
opt-level = "z"
[profile.cli.package.rustls-webpki]
opt-level = "z"
[profile.cli.package.ring]
opt-level = "z"

# The native library an app links (fennec-ffi): release speed, and panics
# that unwind, as the server's do -- each call catches one at the boundary
# and answers FENNEC_PANIC, where `abort` would take the app down with it.
# Named rather than left to `release` so the choice is written where it is
# made, and so a change to `release` does not move it.
[profile.ffi]
inherits = "release"
panic = "unwind"

# On WASM, size comes first.
[profile.wasm]
inherits = "release"
opt-level = "z"
panic = "abort"

# For profiling: release speed plus symbols
[profile.profiling]
inherits = "release"
debug = true
strip = false
