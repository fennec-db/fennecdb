[package]
name = "fennec-http"
description = "HTTP/JSON endpoint for fennecdb: a REST surface derived from the schema"
version.workspace = true
edition.workspace = true
autotests = false
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
fennec-core = { workspace = true, features = ["std-fs", "full"] }
fennec-ql = { workspace = true, features = ["statements"] }
fennec-abi.workspace = true
# HTTPS served by the listeners (`--tls-cert`, `--tls-key`; `src/conn.rs`),
# behind `tls`: the binaries name it, the shell (`fennec backup`) does not.
fennec-tls = { workspace = true, optional = true }

[dev-dependencies]
# The tests' clients of an HTTPS listener.
fennec-tls.workspace = true

[features]
# `timing`: where a request's time goes, phase by phase, at `GET /_timing`
# (`src/timing.rs`); off, none of it is compiled.
timing = []
# `studio`: fennec studio's files, embedded (`src/studio.rs`, `ASSETS`), for
# the binaries that serve it -- fennec-server and fennec-shard, `--studio`.
# The shell, which reaches this crate for `fennec backup`, carries none.
studio = []
tls = ["dep:fennec-tls"]

[[test]]
name = "all"
path = "tests/all.rs"

# Apart: reads the process's own counts.
[[test]]
name = "tenants"
path = "tests/tenants.rs"

# Apart: the audit log and the count of failures are the process's own.
[[test]]
name = "audit"
path = "tests/audit.rs"

# Apart: the quota refusals' counts and the audit log are the process's own.
[[test]]
name = "quotas"
path = "tests/quotas.rs"

# Apart: the count of lists refused past their bound is the process's own.
[[test]]
name = "join_lists"
path = "tests/join_lists.rs"

# Apart: the count of connections refused as they were taken is the
# process's own.
[[test]]
name = "refused_counts"
path = "tests/refused_counts.rs"

# Apart: the count of failed handshakes is the process's own.
[[test]]
name = "tls_failures"
path = "tests/tls_failures.rs"
