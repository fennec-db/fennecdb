[package]
name = "fennec-server"
description = "The fennecdb server: a file or a directory of tenants over HTTP, replicated, archived and followed"
version.workspace = true
edition.workspace = true
autotests = false
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
fennec-core = { workspace = true, features = ["std-fs", "full"] }
# `<file>.lock`, which the native library and `fennec mcp --file` take too.
fennec-abi.workspace = true
fennec-http = { workspace = true, features = ["studio"] }
# `--follow`: a PostgreSQL table mirrored into the file this server serves.
fennec-import.workspace = true
# `--ping` asking a server that serves HTTPS (`--tls-cert`) over TLS.
fennec-tls = { workspace = true, optional = true }

[dev-dependencies]
fennec-ql.workspace = true
# `tests/follow.rs` writes to the PostgreSQL it follows.
fennec-wire.workspace = true
# `tests/https.rs` dials the server's HTTPS.
fennec-tls.workspace = true

[[bin]]
name = "fennec-server"
path = "src/main.rs"

[features]
default = ["tls"]
# The HTTP endpoint's phase timings (`fennec-http`'s `timing`, `GET /_timing`).
timing = ["fennec-http/timing"]
# TLS to the PostgreSQL `--follow` mirrors (`sslmode`): rustls and ring,
# the only dependencies from outside the workspace a shipped binary takes
# (docs/design/crates.md#zero-dependencies). Without it, `--no-default-features`,
# the server takes none.
tls = ["fennec-import/tls", "fennec-http/tls", "dep:fennec-tls"]

[[test]]
name = "all"
path = "tests/all.rs"

# Apart: reads the process's own counts.
[[test]]
name = "metrics"
path = "tests/metrics.rs"

# Apart: reads the process's own counts.
[[test]]
name = "replica"
path = "tests/replica.rs"

# Apart: reads the process's own counts.
[[test]]
name = "statements"
path = "tests/statements.rs"

# Apart: reads the process's own counts.
[[test]]
name = "tenants"
path = "tests/tenants.rs"
