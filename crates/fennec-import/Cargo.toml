[package]
name = "fennec-import"
description = "Import for fennecdb: SQLite files and PostgreSQL servers"
version.workspace = true
edition.workspace = true
autotests = false
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# No external dependencies. The SQLite file format is read by hand; the
# PostgreSQL wire protocol is spoken through fennec-wire's client.
fennec-core = { workspace = true, features = ["std-fs", "full"] }
fennec-wire.workspace = true
# `--where` and `--index` are read by FennecQL's own parser (`args`).
fennec-ql.workspace = true

[features]
default = ["tls"]
# TLS to PostgreSQL (`sslmode`), fennec-wire's: rustls and ring
# (docs/design/crates.md#zero-dependencies).
tls = ["fennec-wire/tls"]

[[test]]
name = "all"
path = "tests/all.rs"
