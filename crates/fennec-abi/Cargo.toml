[package]
name = "fennec-abi"
description = "What fennecdb's C ABIs answer with: the browser module's and the native library's, one code"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
autotests = false

[dependencies]
# Without the indexes, as fennec-ql takes the core: each binding names the
# ones it is built with, and asking for them here would put them back into
# a browser module made without them.
fennec-core = { workspace = true, default-features = false }
fennec-ql.workspace = true

# `lock` names a lock file after the file a link leads to, as the core's
# open resolves it (`fs::resolved`): files, so not the browser module's.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fennec-core = { workspace = true, default-features = false, features = ["std-fs"] }

[features]
default = ["sync"]
# A replica's sync with a server (`sync`): the native library's; the
# browser module is built without it. It reads named statements, to refuse
# them in its own words (`sync::NAMED`): a build of the sync without them
# would answer the parser's "this module is built without them" instead,
# and the native library, its one user, names them anyway.
sync = ["fennec-ql/statements"]

[dev-dependencies]
fennec-core = { workspace = true, features = ["full", "std-fs"] }
# Its tests read named statements; the module it is built into does not.
fennec-ql = { workspace = true, features = ["statements"] }

[[test]]
name = "all"
path = "tests/all.rs"

[[example]]
name = "sync_bench"
path = "examples/sync_bench.rs"
