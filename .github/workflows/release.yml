name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release'
        required: true

# Every job reads alone but the four that publish, each naming the one
# write it uses: `publish` contents (the release, the Go module's tag),
# `image-push`, `manifest` and `image-latest` packages (ghcr.io). A job
# that builds holds no write and its checkout keeps no token: the crates'
# build scripts (ring, cc, ...), Gradle's plugins and the image's build run
# there, and what they make reaches a job that writes only as an artifact.
# tools/workflow_check.py holds every workflow to that, a job that writes
# running only what it lists (docs/design/integrations.md#workflows).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Reads the tag and builds: it writes no release and no package, so its
  # token reads alone, and the checkout does not leave the token in
  # .git/config for the dependencies' build scripts (ring, cc, ...) to find.
  # The artifact upload needs no token of the repository's.
  binaries:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built against musl so the artifacts are static: the same
          # reason the Dockerfile does it, i.e. no libc to match on the host.
          - name: x86_64-linux
            os: ubuntu-24.04
            targets: x86_64-unknown-linux-musl
          - name: aarch64-linux
            os: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-musl
          # One macOS runner covers both architectures: Apple's clang
          # cross-compiles to x86_64 from an arm64 host without extra tooling.
          - name: macos
            os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      # rust-toolchain.toml also asks for wasm32, which this job does not need
      # but which costs one small download; the channel pin is worth keeping.
      - name: Install the pinned toolchain
        run: |
          rustup show
          for t in ${{ matrix.targets }}; do rustup target add "$t"; done

      - name: Install musl tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: |
          set -eu
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          version="${tag#v}"
          mkdir -p dist
          for t in ${{ matrix.targets }}; do
            # `fennec` takes the cli profile (panic = abort): a single process
            # with nothing to recover from, and ~12% smaller without the
            # unwind tables. `fennec-server` stays on release, where a panicking
            # connection thread unwinds and drops only its own session.
            cargo build --profile cli --target "$t" -p fennec-cli
            cargo build --release   --target "$t" -p fennec-server

            stage="fennec-v${version}-${t}"
            mkdir -p "$stage"
            cp "target/$t/cli/fennec" "target/$t/release/fennec-server" "$stage/"
            cp LICENSE README.md CONTRIBUTING.md "$stage/"
            tar -czf "dist/${stage}.tar.gz" "$stage"
            rm -rf "$stage"
            echo "${stage}.tar.gz  $(wc -c < "dist/${stage}.tar.gz") bytes"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # The Windows zip (docs/design/windows.md, decision 6): fennec.exe and
  # fennec-server.exe with the C runtime linked in, a fresh Windows having
  # no Visual C++ redistributable to lend them (tools/windows-zip.sh, under
  # the runner's bash as the tarballs' build is), then installed through
  # site/install.ps1 from the folder it was made in and run -- each
  # program's version, a row written into a file and read back -- before it
  # is kept (tools/windows-zip-check.ps1), as a .deb and an .rpm are. CI's
  # `windows (release zip)` job runs the same two scripts on every change,
  # so a tag meets no step here CI has not run. Unsigned, and named by its
  # checksum in SHA256SUMS with the rest. x86_64 and aarch64, each on a
  # runner of its own architecture, which runs what it built. A tag from
  # before the scripts -- a dispatch for an older one -- builds none, and
  # says so.
  #
  # Read-only, its checkout keeping no token: the crates' build scripts (ring,
  # cc, windows_aarch64_msvc) run here, and only the jobs that publish write.
  windows:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86_64-windows, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: aarch64-windows, os: windows-11-arm, target: aarch64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Whether the tag builds for Windows
        id: has
        run: |
          if [ -f tools/windows-zip.sh ]; then
            echo "zip=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TAG is from before the Windows release (docs/design/windows.md): no zip"
          fi

      - name: Install the pinned toolchain
        if: steps.has.outputs.zip == '1'
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Build the zip
        if: steps.has.outputs.zip == '1'
        run: tools/windows-zip.sh "${TAG#v}" ${{ matrix.target }} dist

      - name: Install it through install.ps1 and run it
        if: steps.has.outputs.zip == '1'
        shell: pwsh
        run: ./tools/windows-zip-check.ps1 -Version ($env:TAG -replace '^v', '') -Zip (Get-Item dist/*.zip).FullName

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.has.outputs.zip == '1'
        with:
          name: dist-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  # Read-only, its checkout keeping no token, as `binaries`: `make wasm`
  # runs cargo.
  wasm:
    name: wasm bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show

      - name: Build
        run: |
          set -eu
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          version="${tag#v}"
          make wasm
          mkdir -p dist "fennec-web-v${version}"
          # What a page actually needs: the module, with every index, the
          # bundle and the types, the collation data the module fetches
          # beside it, and a note on the files. fennec.js imports builder.js and
          # http.js; client.js is the two without the engine.
          cp web/fennec.js web/builder.js web/http.js web/client.js web/fennec.wasm web/fennec.d.ts web/client.d.ts LICENSE "fennec-web-v${version}/"
          cp web/README.md "fennec-web-v${version}/README.md"
          cp -r web/collate "fennec-web-v${version}/"
          tar -czf "dist/fennec-web-v${version}.tar.gz" "fennec-web-v${version}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-wasm
          path: dist/*.tar.gz
          if-no-files-found: error

  # The XCFramework SwiftPM fetches by the URL and checksum Package.swift
  # names at this tag. It was built before the tag (swift-binary.yml), since
  # the checksum had to be in the tagged manifest: here it is found by that
  # run and held to the checksum, and the release attaches it. A release
  # whose manifest names no such zip stops here rather than ship a package
  # SwiftPM would refuse.
  #
  # It writes nothing: the run's list and its artifact are the Actions API's
  # to read (`actions: read`, as linux-power-cut.yml's `gh run download`
  # asks; a public repository's answer them to a token without it, which is
  # what v0.2.0's run had), and the checkout keeps no token.
  apple:
    name: XCFramework (from swift-binary)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Find the zip Package.swift names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          release=$(sed -n 's/^let release = "\(.*\)"/\1/p' Package.swift)
          want=$(sed -n 's/^let checksum = "\(.*\)"/\1/p' Package.swift)
          if [ "$release" != "$version" ]; then
            echo "::error::Package.swift names release $release, not $version: run swift-binary.yml for $version and merge its pull request before tagging (RELEASING.md)"
            exit 1
          fi
          run=$(gh run list -R "${{ github.repository }}" --workflow swift-binary.yml --status success -L 100 \
            --json databaseId,displayTitle \
            -q "[.[] | select(.displayTitle == \"Swift binary for v$version\")][0].databaseId")
          if [ -z "$run" ]; then
            echo "::error::no successful swift-binary.yml run for v$version"
            exit 1
          fi
          mkdir -p dist
          gh run download "$run" -R "${{ github.repository }}" -n "xcframework-v$version" -D dist
          got=$(sha256sum dist/FennecFFI.xcframework.zip | cut -d' ' -f1)
          if [ "$got" != "$want" ]; then
            echo "::error::run $run's zip is $got; Package.swift names $want"
            exit 1
          fi
          echo "FennecFFI.xcframework.zip from run $run, checksum $got"
          # The Flutter plugin's frameworks, built by the same run.
          test -f dist/FennecFFIDynamic.xcframework.zip || {
            echo "::error::run $run kept no FennecFFIDynamic.xcframework.zip"
            exit 1
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-apple
          path: |
            dist/FennecFFI.xcframework.zip
            dist/FennecFFI.xcframework.zip.checksum
            dist/FennecFFIDynamic.xcframework.zip
          if-no-files-found: error

  # The Android AAR: the Kotlin library with the native library for
  # arm64-v8a, armeabi-v7a and x86_64, built with the runner's NDK.
  # Read-only, its checkout keeping no token: Gradle's plugins and the
  # crates' build scripts run here.
  android:
    name: Android AAR
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install the pinned toolchain and the Android targets
        run: |
          rustup show
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.10.2'

      - name: Build
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          integrations/kotlin/build-aar.sh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-android
          path: dist/*.aar
          if-no-files-found: error

  # The .deb and .rpm, made from the musl tarballs the `binaries` jobs just
  # built (tools/linux-packages.sh, packaging/nfpm.yaml). The binaries are
  # static, so a package depends on nothing, and nfpm makes both formats from
  # one description without dpkg or rpmbuild. nfpm is the release binary
  # tools/install-nfpm.sh pins, held to its checksum. Each architecture is
  # packed on a runner of its own, and its packages are installed, run and
  # removed in a Debian and a Fedora container of that architecture before
  # they are kept: a package that does not install stops the release here,
  # not on a user's machine. They go on the release beside the tarballs and
  # are in its SHA256SUMS.
  #
  # The checkout is this workflow's own commit -- the tag's, when a tag was
  # pushed -- and not the tag a dispatch names: the tarballs are the
  # artifacts and the version is the tag's name, so what is needed from the
  # tree is the packaging files, which a tag from before them (a dispatch for
  # an older tag whose release is still a draft) does not have.
  linux-packages:
    name: .deb and .rpm (${{ matrix.arch }})
    needs: binaries
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: amd64, artifact: dist-x86_64-linux }
          - { os: ubuntu-24.04-arm, arch: arm64, artifact: dist-aarch64-linux }
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: tarballs

      - name: Install nfpm
        run: |
          tools/install-nfpm.sh "$RUNNER_TEMP/nfpm"
          echo "$RUNNER_TEMP/nfpm" >> "$GITHUB_PATH"

      # The files' times are the commit's: the same commit packs the same bytes.
      - name: Build
        run: |
          set -eu
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          tools/linux-packages.sh "${TAG#v}" tarballs dist ${{ matrix.arch }}

      - name: Install, run and remove them
        run: tools/linux-packages-check.sh "${TAG#v}" dist ${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-packages-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  # The server's image, ghcr.io/<owner>/fennec-server, in four jobs: this
  # one builds each architecture's on a runner of its own, `image-push`
  # pushes each under an arch-suffixed tag, `manifest` stitches them
  # together as `<version>`, and `image-latest` moves `latest` to it once
  # the release is published (or packages.yml's `image-latest` does). A
  # runner of each architecture is the reason there is no QEMU step --
  # emulating a Rust build is many times slower than a second runner. The
  # build holds no write and its checkout keeps no token: the
  # crates' build scripts run in the image's cargo build. Each image is run
  # on the runner that built it before it is kept (tools/image-check.sh:
  # its `--version`, and the server its own CMD starts turning healthy by
  # its own HEALTHCHECK, `fennec-server --ping`), so an image that does not
  # start never reaches ghcr.io, and it is handed to `image-push` as the
  # file `docker save` writes.
  image:
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    env:
      # BuildKit is what the Dockerfile's --mount=type=cache needs.
      DOCKER_BUILDKIT: '1'
      IMAGE: ghcr.io/${{ github.repository_owner }}/fennec-server
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Build
        run: |
          set -eu
          version="${TAG#v}"
          # image.source is what makes GHCR attach the package to this
          # repository, and with it the repository's permissions. The
          # revision is the commit checked out, the tag's: a dispatch's
          # github.sha is the branch it ran from.
          revision=$(git rev-parse HEAD)
          docker build \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision="$revision" \
            --label org.opencontainers.image.version="$version" \
            --label org.opencontainers.image.licenses=Apache-2.0 \
            -t "$IMAGE:$version-${{ matrix.arch }}" .

      # The check is this workflow's own commit's, as `linux-packages`'s
      # files are: a dispatch for a tag from before it has none. Taken after
      # the build, so the build's context is the tag's tree alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: workflow
          persist-credentials: false
          sparse-checkout: tools/image-check.sh
          sparse-checkout-cone-mode: false

      - name: Run it, its version and its own health check
        run: workflow/tools/image-check.sh "$IMAGE:${TAG#v}-${{ matrix.arch }}" "${TAG#v}"

      - name: Keep it
        run: docker save -o "image-${{ matrix.arch }}.tar" "$IMAGE:${TAG#v}-${{ matrix.arch }}"

      # For `image-push`, later in this run, alone: a day is room for a
      # re-run of a push that failed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.tar
          retention-days: 1
          if-no-files-found: error

  # The one job holding packages: write for the arch-suffixed tags, and it
  # builds nothing and runs no image: it loads the two `image` saved, holds
  # each to the platform its tag names, and pushes them. Both or neither:
  # an architecture whose build or check failed holds back the other's tag.
  #
  # On ubuntu-24.04, the Docker that built and saved them (28, its classic
  # image store), and not ubuntu-latest, which is Ubuntu 26.04 now: its
  # Docker 29 keeps images in containerd's store, and an image it loads from
  # `docker save`'s file it pushes as it stored it, under an OCI manifest
  # with the layers uncompressed -- 8.18 MB an architecture where v0.2.0's
  # Docker v2 manifest names 4.08 MB of gzip layers. So the push refuses a
  # Docker on containerd's store, and each tag pushed is read back from
  # ghcr.io and held to v0.2.0's media types: should 24.04's Docker move to
  # that store too, the release stops here and says why, instead of
  # shipping an image twice the size in another format.
  image-push:
    name: image (push)
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/fennec-server
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: images
          merge-multiple: true

      - name: Load the images
        run: |
          set -eu
          version="${TAG#v}"
          store=$(docker info --format '{{json .DriverStatus}}')
          case $store in
            *io.containerd.snapshotter*)
              echo "::error::this runner's Docker $(docker version --format '{{.Server.Version}}') keeps images in containerd's store, and would push these as OCI manifests with uncompressed layers, not the Docker v2 manifests and gzip layers v0.2.0's are: run image-push where Docker keeps its classic store (release.yml)"
              exit 1
              ;;
          esac
          for arch in amd64 arm64; do
            docker load -i "images/image-$arch.tar"
            platform=$(docker image inspect -f '{{.Os}}/{{.Architecture}}' "$IMAGE:$version-$arch")
            if [ "$platform" != "linux/$arch" ]; then
              echo "::error::$IMAGE:$version-$arch is an image for $platform, not linux/$arch"
              exit 1
            fi
          done

      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push
        run: |
          set -eu
          for arch in amd64 arm64; do
            docker push "$IMAGE:${TAG#v}-$arch"
          done

      # Each tag as ghcr.io now holds it: one platform's image, a Docker v2
      # manifest naming a Docker image config and gzip layers, as v0.2.0's
      # -amd64 and -arm64 are.
      - name: Each tag is one platform's Docker v2 manifest, its layers gzip
        run: |
          set -eu
          for arch in amd64 arm64; do
            ref="$IMAGE:${TAG#v}-$arch"
            raw=$(docker buildx imagetools inspect --raw "$ref")
            platform=$(docker buildx imagetools inspect --format '{{json .Image}}' "$ref" | jq -r '"\(.os)/\(.architecture)"')
            if [ "$platform" != "linux/$arch" ] || ! printf '%s' "$raw" | jq -e '
                .mediaType == "application/vnd.docker.distribution.manifest.v2+json"
                and .config.mediaType == "application/vnd.docker.container.image.v1+json"
                and (.layers | length) > 0
                and all(.layers[]; .mediaType == "application/vnd.docker.image.rootfs.diff.tar.gzip")' >/dev/null; then
              echo "::error::$ref is not one linux/$arch image of a Docker v2 manifest and gzip layers, as v0.2.0's tags are: it is $platform, $raw"
              exit 1
            fi
            echo "$ref: linux/$arch, $(printf '%s' "$raw" | jq '[.layers[].size] | add') bytes of gzip layers"
          done

  # The multi-arch tag, `<version>`, made from the two pushed above: a
  # manifest list written on ghcr.io, nothing built or run. Only once
  # `publish` has drafted the release, which follows every job that builds
  # its files, `binaries` among them. `latest` follows in `image-latest`.
  #
  # On ubuntu-24.04, as `image-push`: `imagetools create` writes a Docker
  # manifest list from two Docker v2 manifests, as v0.2.0's `0.2.0` is, and
  # the list is held to that after.
  manifest:
    name: image (manifest)
    needs: [binaries, publish, image-push]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/fennec-server
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Join the per-architecture images
        run: |
          set -eu
          version="${TAG#v}"
          docker buildx imagetools create -t "$IMAGE:$version" "$IMAGE:$version-amd64" "$IMAGE:$version-arm64"
          docker buildx imagetools inspect "$IMAGE:$version"

      # The list as ghcr.io holds it: a Docker manifest list of two Docker
      # v2 manifests, linux/amd64 and linux/arm64, each the one its arch tag
      # names, as v0.2.0's is.
      - name: The list is v0.2.0's kind, naming the two arch tags
        run: |
          set -eu
          version="${TAG#v}"
          digest() { docker buildx imagetools inspect --format '{{json .Manifest}}' "$1" | jq -r .digest; }
          amd=$(digest "$IMAGE:$version-amd64")
          arm=$(digest "$IMAGE:$version-arm64")
          raw=$(docker buildx imagetools inspect --raw "$IMAGE:$version")
          if ! printf '%s' "$raw" | jq -e --arg amd "$amd" --arg arm "$arm" '
              .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json"
              and ([.manifests[] | {mediaType, platform: "\(.platform.os)/\(.platform.architecture)", digest}]
                | sort_by(.platform)) == [
                  {mediaType: "application/vnd.docker.distribution.manifest.v2+json", platform: "linux/amd64", digest: $amd},
                  {mediaType: "application/vnd.docker.distribution.manifest.v2+json", platform: "linux/arm64", digest: $arm}]' >/dev/null; then
            echo "::error::$IMAGE:$version is not the Docker manifest list of $amd (amd64) and $arm (arm64) v0.2.0's kind is: $raw"
            exit 1
          fi
          echo "$IMAGE:$version: a Docker manifest list of linux/amd64 $amd and linux/arm64 $arm"

  # `latest` on ghcr.io, once `manifest` has made `<version>`, the list it
  # copies. tools/image-latest.sh moves it, as packages.yml's `image-latest`
  # does once the release is published, so whichever of the two runs second
  # moves it: at the tag's push the release is a draft, and this says so and
  # ends; a release published before its image jobs passed -- packages.yml's
  # run found no `<version>` and failed saying so -- gets `latest` here, in
  # this run made again once they pass. Never a draft or a pre-release, and
  # never any version but the newest published release's, so a dispatch for
  # an old tag leaves it. A job of its own, in the same concurrency group as
  # packages.yml's, one a version: the group's pending job is cancelled by
  # the next one queued, which must never be the job making `<version>`, nor
  # a newer release's move cancelled by an old tag's dispatch.
  image-latest:
    name: image (latest)
    needs: manifest
    runs-on: ubuntu-24.04
    concurrency:
      group: image-latest-${{ github.event.inputs.tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/fennec-server
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # This workflow's own commit's, as `image`'s check is: a dispatch for a
      # tag from before the script has none.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: workflow
          persist-credentials: false
          sparse-checkout: tools/image-latest.sh
          sparse-checkout-cone-mode: false

      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Move latest, where this is the newest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: workflow/tools/image-latest.sh "$IMAGE" "$TAG"

  # The one job writing to the repository: the release and its assets, and
  # the Go module's tag, pushed with the checkout's token. It builds nothing:
  # what it attaches is the artifacts of the jobs above, which read alone.
  publish:
    name: publish the release
    needs: [binaries, windows, wasm, apple, android, linux-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip *.aar *.deb *.rpm > SHA256SUMS
          cat SHA256SUMS

      # A Go module in a subdirectory is fetched by a tag naming its
      # directory: `go get github.com/fennec-db/fennecdb/integrations/go@vX.Y.Z`
      # looks for integrations/go/vX.Y.Z, and vX.Y.Z alone is none of its
      # versions. Pushed beside the release's own, at the same commit, once
      # the builds above have passed; a push with the workflow's token starts
      # no workflow, and the tag matches no `v*` anyway. One already there,
      # from a release run again, is left: a module's version, once fetched,
      # is fixed in the checksum database and must not move.
      - name: Tag the Go module
        run: |
          set -eu
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gotag="integrations/go/$tag"
          if git ls-remote --exit-code --tags origin "refs/tags/$gotag" >/dev/null; then
            echo "$gotag is there already"
          else
            git tag "$gotag" HEAD
            git push origin "refs/tags/$gotag"
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # Drafted, not published: the notes get a read before the release
          # goes out. `gh release edit --draft=false` publishes it.
          #
          # Re-running a release has to work -- a job retried after a runner
          # failure, or the release dispatched again for its tag once a fix
          # to this workflow is in; the tag itself is never moved
          # (RELEASING.md, *GitHub*) -- and `gh release create` refuses when
          # one already exists, so an existing release is updated in place
          # instead: a draft's assets are replaced.
          #
          # A published release's are not. The tarballs, the Windows zip and
          # SHA256SUMS are what the Homebrew formula, install.sh, install.ps1
          # and the packages name by checksum, and a rebuild is not byte for
          # byte the first build: a replaced tarball would fail every `brew
          # install` and every checksum already taken from the old
          # SHA256SUMS. So a published release only gets the files it has no
          # asset of.
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft -q .isDraft)" = true ]; then
              gh release upload "$tag" dist/* --clobber
            else
              have=$(gh release view "$tag" --json assets -q '.assets[].name')
              for f in dist/*; do
                name=$(basename "$f")
                if printf '%s\n' "$have" | grep -qxF "$name"; then
                  echo "$name is on the published release already: left as it is"
                else
                  gh release upload "$tag" "$f"
                  echo "::warning::$name was missing from the published release $tag and was added; the release's SHA256SUMS is not rewritten and does not list it"
                fi
              done
            fi
          else
            gh release create "$tag" dist/* \
              --draft \
              --title "$tag" \
              --generate-notes
          fi
