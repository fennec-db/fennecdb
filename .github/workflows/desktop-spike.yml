name: desktop-spike

# TEMPORARY: measurements for the Windows hardening of the desktop app
# (scripts/spike/), taken out before review.
on:
  push:
    branches: [desktop-windows-hardening]
    paths:
      - '.github/workflows/desktop-spike.yml'
      - 'integrations/studio-desktop/scripts/spike/**'

permissions:
  contents: read

jobs:
  spike:
    name: spike on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest }
          - { name: Windows arm64, os: windows-11-arm }
    defaults:
      run:
        shell: bash
        working-directory: integrations/studio-desktop
    env:
      STUDIO_SERVER_RELEASE: '0.2.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Where the checks write
        run: echo "SD_DIR=$RUNNER_TEMP/fennec-desktop-checks" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/cache@v6
        with:
          path: integrations/studio-desktop/.hutch-home
          key: desktop-hutch-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('integrations/studio-desktop/package-lock.json', 'integrations/studio-desktop/hutch.config.ts', 'integrations/studio-desktop/hutch-pin.json') }}
      - name: npm ci
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: The server and shell of the release
        run: sh scripts/get-server.sh "$STUDIO_SERVER_RELEASE"
      - name: Build the test variant
        run: FENNEC_DESKTOP_TEST_BUILD=1 npm run build
      - name: Install it (warmup)
        run: ONLY=warmup node scripts/checks/run.mjs
      - name: The spike
        run: node scripts/spike/wv2.mjs
      - name: Every check, on this branch's app
        if: always()
        run: node scripts/checks/run.mjs
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spike-logs-${{ runner.arch }}
          path: ${{ runner.temp }}/fennec-desktop-checks/logs
          retention-days: 5
          if-no-files-found: ignore
