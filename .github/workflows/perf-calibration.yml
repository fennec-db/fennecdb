# TEMPORARY -- removed before this pull request is marked ready. The perf
# gate's calibration (docs/design/benchmarks.md#the-gate), third pass: the
# first pass's pairs and control again, judged with the allocator's calls
# priced at the base's cost a call and core-facet picking its commonest
# brand. The merged pull requests make instr-compare judged neutral must all
# pass, the known regressions must all fail, and the base held to itself,
# two builds of one commit at two paths as the gate builds them, twenty
# times over, must stay under the threshold, every delta 0.1% or less.
name: perf calibration

on:
  pull_request:
    paths:
      - .github/workflows/perf-calibration.yml
      - tools/perf_gate.py
      - crates/fennec-http/examples/gate.rs

permissions:
  contents: read

# Every build, of an old commit too, uses the toolchain main pins: an old
# commit's rust-toolchain.toml says `stable`, which two parallel builds would
# install at once and fail renaming a component file. It is installed once,
# below, before any build starts.
env:
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  pair:
    name: calibration (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Neutral: merged, instr-compare's figures inside the noise.
          - { name: "neutral #531", slug: "531", base: 088bc30f, head: de59fdd1 }
          - { name: "neutral #524", slug: "524", base: a96bd554, head: c736b5c0 }
          - { name: "neutral #506 (the #513 v1/bc7636b2 pair)", slug: "506", base: edb629d2, head: bc7636b2 }
          - { name: "neutral #513", slug: "513", base: fb93539e, head: 61fe4261 }
          - { name: "neutral #542 as merged", slug: "542", base: 4a157cdd, head: 1dee77aa }
          - { name: "neutral #474 as merged", slug: "474", base: d45afa21, head: e3d58955 }
          # Known regressions: each measured before it was fixed or undone.
          - { name: "regression #511 undone (JSON numbers -8.7%)", slug: "r511", base: 82319b7f, head: 9da6411e }
          - { name: "regression #542 first head (read +1.41%, write +1.65%)", slug: "r542", base: de23ce27, head: 0e05fe22 }
          - { name: "regression #474 first head (scoped writes +1 128)", slug: "r474", base: e1d6a47c, head: 41f293a9 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned toolchain, the musl target, valgrind and musl-gcc
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind musl-tools

      - name: Replay the pair with this pull request's program
        run: |
          start=$(date +%s)
          python3 tools/perf_gate.py run --base "${{ matrix.base }}" --head "${{ matrix.head }}" \
            --target x86_64-unknown-linux-musl --work "$RUNNER_TEMP/perf" \
            --out "$RUNNER_TEMP/perf/results.json" --no-check
          echo "replayed in $(( $(date +%s) - start )) s"
          python3 tools/perf_gate.py check "$RUNNER_TEMP/perf/results.json" --summary "$GITHUB_STEP_SUMMARY" \
            && echo "CALIBRATION-VERDICT pass" || echo "CALIBRATION-VERDICT fail"
          echo "CALIBRATION-RESULTS $(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1]))))' "$RUNNER_TEMP/perf/results.json")"
          cp "$RUNNER_TEMP/perf/results.json" "$RUNNER_TEMP/perf/profiles/"

      # Each side's median run of each workload, by function, and the
      # results: where a verdict comes from, for callgrind_annotate.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-calibration-${{ matrix.slug }}
          path: ${{ runner.temp }}/perf/profiles/
          retention-days: 7

  control:
    name: control (part ${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install the pinned toolchain, the musl target, valgrind and musl-gcc
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind musl-tools

      # Two builds of the base at two paths, as the gate builds a base and
      # a pull request changing no code; five rounds of the gate's count
      # over them a part, four parts: twenty.
      - name: The base against itself, five rounds
        run: |
          W="$RUNNER_TEMP/perf"
          python3 tools/perf_gate.py run --base HEAD^1 --head HEAD^1 --target x86_64-unknown-linux-musl \
            --work "$W" --out "$W/r0.json" --no-check
          bin=x86_64-unknown-linux-musl/release/examples/gate
          cmp "$W/base-target/$bin" "$W/head-target/$bin" && echo "CALIBRATION-IDENTICAL yes" || echo "CALIBRATION-IDENTICAL no"
          for i in 1 2 3 4 5; do
            python3 tools/perf_gate.py measure --base-bin "$W/base-target/$bin" --head-bin "$W/head-target/$bin" \
              --out "$W/r$i.json"
            python3 tools/perf_gate.py check "$W/r$i.json" --summary "$GITHUB_STEP_SUMMARY" \
              && echo "CALIBRATION-VERDICT pass" || echo "CALIBRATION-VERDICT fail"
            echo "CALIBRATION-RESULTS $(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1]))))' "$W/r$i.json")"
          done
