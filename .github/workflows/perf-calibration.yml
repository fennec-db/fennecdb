# TEMPORARY -- removed before this pull request is marked ready. The perf
# gate's calibration (docs/design/benchmarks.md#the-gate), second pass: the
# two merged pull requests make instr-compare judged neutral that the gate
# failed (#474 as merged, #524), replayed with every median run's profile
# kept, the workloads that moved profiled by instruction, and the binaries
# kept, for callgrind_annotate and a disassembler; and where core-facet's
# count moves, over the facet's variants (gate.rs's LOOKS), counted ten
# times each on one build of main.
name: perf calibration

on:
  pull_request:
    paths:
      - .github/workflows/perf-calibration.yml
      - tools/perf_gate.py
      - crates/fennec-http/examples/gate.rs

permissions:
  contents: read

# Every build, of an old commit too, uses the toolchain main pins: an old
# commit's rust-toolchain.toml says `stable`, which two parallel builds would
# install at once and fail renaming a component file. It is installed once,
# below, before any build starts.
env:
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  pair:
    name: profiles (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "neutral #474 as merged", slug: "474", base: d45afa21, head: e3d58955 }
          - { name: "neutral #524", slug: "524", base: a96bd554, head: c736b5c0 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned toolchain, the musl target, valgrind and musl-gcc
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind musl-tools

      - name: Replay the pair with this pull request's program
        run: |
          W="$RUNNER_TEMP/perf"
          python3 tools/perf_gate.py run --base "${{ matrix.base }}" --head "${{ matrix.head }}" \
            --target x86_64-unknown-linux-musl --work "$W" --out "$W/results.json" --no-check
          python3 tools/perf_gate.py check "$W/results.json" --summary "$GITHUB_STEP_SUMMARY" \
            && echo "CALIBRATION-VERDICT pass" || echo "CALIBRATION-VERDICT fail"
          echo "CALIBRATION-RESULTS $(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1]))))' "$W/results.json")"

      - name: The workloads that moved, by instruction, one run a side
        run: |
          W="$RUNNER_TEMP/perf"
          K="$W/keep"
          bin=x86_64-unknown-linux-musl/release/examples/gate
          mkdir -p "$K/instr"
          cp "$W/base-target/$bin" "$K/base-gate"
          cp "$W/head-target/$bin" "$K/head-gate"
          cp -r "$W/profiles" "$K/profiles"
          cp "$W/results.json" "$K/results.json"
          for w in core-put core-get-id core-filter-limit core-order core-match http-get-row http-patch http-put http-batch http-scoped-set; do
            for side in base head; do
              echo "$w $side"
            done
          done | xargs -P 4 -n 2 sh -c 'valgrind --tool=callgrind --instr-atstart=no --collect-atstart=no \
            --dump-instr=yes --dump-line=no --callgrind-out-file="$0/instr/$1.$2.callgrind" "$0/$2-gate" "$1" \
            > /dev/null 2>&1 || echo "$1 $2: did not run"' "$K"
          ls -la "$K" "$K/instr"

      - name: callgrind_annotate, each side's median run, by function
        run: |
          K="$RUNNER_TEMP/perf/keep"
          for w in core-put core-get-id core-filter-limit core-order http-get-row http-patch http-put http-scoped-set; do
            for side in base head; do
              f="$K/profiles/$w.$side.callgrind"
              [ -f "$f" ] || continue
              echo "=== $w $side (self)"
              callgrind_annotate --inclusive=no --threshold=99.5 "$f" | sed -n '1,60p'
            done
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-diag-${{ matrix.slug }}
          path: ${{ runner.temp }}/perf/keep/
          retention-days: 14

  facet:
    name: facet's spread
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install the pinned toolchain, the musl target, valgrind and musl-gcc
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind musl-tools

      # The merge's tree: main's crates, this pull request's program.
      - name: Build the gate program
        run: |
          CARGO_PROFILE_RELEASE_STRIP=false cargo build --locked --release -p fennec-http --example gate \
            --target x86_64-unknown-linux-musl
          mkdir -p "$RUNNER_TEMP/facet/profiles"
          cp target/x86_64-unknown-linux-musl/release/examples/gate "$RUNNER_TEMP/facet/gate"

      - name: Each variant counted ten times, core-facet's every profile kept
        run: |
          cat > "$RUNNER_TEMP/facet/spread.py" <<'EOF'
          import concurrent.futures, os, shutil, statistics, sys, tempfile
          sys.path.insert(0, "tools")
          import perf_gate
          gate, keep = sys.argv[1], sys.argv[2]
          looks = [("core-facet", 512, 10), ("look-facet-top1", 512, 10), ("look-facet-all", 512, 10),
                   ("look-facet-one", 512, 10), ("look-facet-one-top1", 512, 10),
                   ("look-facet-scan", 64, 10), ("look-facet-4096", 4096, 5)]
          scratch = tempfile.mkdtemp()
          tasks = [(name, ops, r) for name, ops, runs in looks for r in range(runs)]
          out = {}
          with concurrent.futures.ThreadPoolExecutor(max_workers=os.cpu_count()) as pool:
              futs = {pool.submit(perf_gate.one_run, gate, name, ops, scratch): (name, ops, r) for name, ops, r in tasks}
              for fut in concurrent.futures.as_completed(futs):
                  name, ops, r = futs[fut]
                  n, path = fut.result()
                  out.setdefault(name, []).append((n, ops))
                  if name == "core-facet":
                      shutil.move(path, os.path.join(keep, f"core-facet.{r}.callgrind"))
                  else:
                      os.unlink(path)
          for name, _, _ in looks:
              runs = sorted(n / ops for n, ops in out[name])
              med = statistics.median_low(runs)
              print(f"FACET-SPREAD {name}: median {med:.1f} an op, min {runs[0]:.1f}, max {runs[-1]:.1f}, "
                    f"range {(runs[-1] - runs[0]) / med * 100:.3f}%, runs {[round(x, 1) for x in runs]}")
          EOF
          python3 "$RUNNER_TEMP/facet/spread.py" "$RUNNER_TEMP/facet/gate" "$RUNNER_TEMP/facet/profiles"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-diag-facet
          path: ${{ runner.temp }}/facet/
          retention-days: 14
