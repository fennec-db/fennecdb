name: site

# The website and docs deploy to Cloudflare Workers. The home page runs the
# real engine, so the wasm module is built here and shipped with the assets.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      # The playground is fennec studio's files, served from the site.
      - 'studio/**'
      - 'web/fennec.js'
      - 'web/builder.js'
      - 'web/http.js'
      - 'web/client.js'
      # The FennecQL pages' builder tabs are rendered from the golden cases.
      - 'integrations/builder-golden.json'
      - 'web/golden.mjs'
      - 'wrangler.jsonc'
      - 'crates/fennec-wasm/**'
      - 'crates/fennec-abi/**'
      - 'crates/fennec-core/**'
      - 'crates/fennec-ql/**'
      # install.ps1 is served only once this has parsed it.
      - 'tools/install-ps1-check.ps1'
      - '.github/workflows/site.yml'
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The Cloudflare secrets are the repository's for now, which any branch's
  # workflow reads: a dispatch from a branch deploys that branch's site with
  # the token. They are to move into a `site` environment that lets only
  # main's runs deploy (site/README.md, RELEASING.md's *GitHub*). The owner
  # creates it first, then this job names it again
  # (`environment: { name: site, url: https://fennecdb.com }`) and
  # tools/workflow_check.py's REPOSITORY_SECRETS drops the job: naming an
  # environment that does not exist makes GitHub create it at the next
  # deploy, with no rules -- a settings change no pull request should make.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins an exact release and asks for wasm32-unknown-unknown.
      - name: Install the pinned toolchain
        run: rustup show

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: site-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: site-cargo-

      # build.py minifies the JS and CSS through esbuild when it finds it on
      # PATH and ships the readable source when it does not, so this step is
      # what decides whether the deploy is minified. Pinned for the same
      # reason wrangler is below: a silent major bump would change the output
      # of every asset hash.
      - name: Install esbuild
        run: npm install -g esbuild@0.28.2

      # site/build.py checks every size the site quotes against the file it
      # describes, and the brotli figures need the CLI: the standard library
      # has gzip and nothing else. Without it those claims come back
      # unverified, which build.py treats as a failure under CI rather than
      # shipping a number nobody checked.
      - name: Install brotli
        run: sudo apt-get install -y --no-install-recommends brotli

      # build.py also writes the search index through the module, and fails
      # when it is missing or empty or a known query does not find its page
      # first (site/search.test.mjs). The sections' vectors come from the
      # committed cache (site/search-embeddings.json); a section new or
      # changed since is embedded through Workers AI with these, when the
      # token may run it (CLOUDFLARE_AI_TOKEN, or the deploy token given
      # Workers AI Read), and goes without a vector otherwise -- found by its
      # words alone until someone commits the cache again. Never a failure.
      #
      # The build also runs tools/install-ps1-check.ps1 under the runner's
      # own `pwsh` (preinstalled on ubuntu-latest) on site/install.ps1, which
      # `irm | iex` runs in a visitor's session: it fails, and the file is
      # not served, unless the top level is functions and the one last call
      # and no expression is invoked in it.
      - name: Build the wasm module and the site
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: make site

      # The cache as the build left it, the sections it embedded beside the
      # ones it was handed, for someone to commit: until it is, a pull
      # request's CI, which cannot embed, tests the search by meaning over
      # the committed vectors and this deploy over the fresh ones, and a
      # ranking one passed the other can fail (docs/mobile 3rd for a
      # Turkish question in CI, 4th here once 217 sections were embedded).
      # Kept whether the build passed or not, since a failed one is when it
      # is needed.
      - name: Keep the vectors this build embedded
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: search-embeddings
          path: site/search-embeddings.json
          retention-days: 14

      # Every internal link and anchor in the built pages has to resolve: a
      # page renamed or a heading's id changed leaves links that land
      # nowhere, and nothing else would say so before a reader found one.
      - name: Check the internal links
        run: python3 site/check_links.py

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          # The action defaults to wrangler 3, which predates Workers static
          # assets and rejects this config outright ("Missing entry-point")
          # because an assets-only worker has no `main`. Keep this in step with
          # the version the site is tested against locally.
          wranglerVersion: "4.135.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
