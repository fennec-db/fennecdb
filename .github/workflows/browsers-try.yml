name: browsers-try

# A temporary run of web/browser/ before its pull request: Safari through
# safaridriver twenty times, Chrome and Firefox three. Never merged.
on:
  push:
    branches: [v1-t53-try]

permissions:
  contents: read

jobs:
  module:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - run: make wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browsers-fennec-wasm
          path: web/fennec.wasm
          if-no-files-found: error
          retention-days: 1

  browsers:
    needs: module
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            engines: chrome, firefox
            runs: 3
          - os: macos-latest
            engines: safari
            runs: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browsers-fennec-wasm
          path: web
      - if: matrix.os == 'ubuntu-latest'
        working-directory: web/browser
        run: npm ci --no-audit --no-fund --loglevel=error
      - if: matrix.os == 'macos-latest'
        run: sudo safaridriver --enable
      - env:
          CHROME_PATH: /usr/bin/google-chrome
          FIREFOX_PATH: /usr/bin/firefox
        run: |
          ls -la /usr/bin/firefox /usr/bin/google-chrome 2>&1 || true
          for i in $(seq ${{ matrix.runs }}); do
            echo "::group::run $i"
            if ! node web/browser/run.mjs ${{ matrix.engines }}; then
              echo "::endgroup::"
              echo "run $i failed"
              exit 1
            fi
            echo "::endgroup::"
          done
