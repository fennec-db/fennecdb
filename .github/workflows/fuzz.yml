name: fuzz

# Each target of the fuzzer for half an hour a week, built with
# AddressSanitizer and LLVM's coverage counters: the long run beside ci.yml's
# `fuzz-smoke`, which gives each 30 s on every pull request
# (docs/design/conventions.md#fuzzing). The matrix names every target
# `fennec-fuzz names` lists, held to it by crates/fennec-fuzz's tests.
#
# The repository is public, and so are a run's log and its artifacts, for
# 90 days: a finding keeps no input and says neither its message nor its
# backtrace (`--private`; ASan's report goes into a file of the runner's,
# which nothing uploads), only its recipe -- the target, the seed, the run
# and its input's hash -- from which `fennec-fuzz reproduce` makes the
# input again on a maintainer's machine, to be reported as SECURITY.md
# asks. So each week starts from the repository's seeds, its own seed the
# run's number: a corpus carried from the week before would be inputs no
# maintainer holds, which the recipe could not make again.
on:
  schedule:
    - cron: '23 3 * * 0'
  workflow_dispatch:

# Every job reads: none writes to the repository, its packages or a registry.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }}, 30 min under ASan)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [http, json, fennecql, codec, image, sqlite]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The nightly is the Makefile's FUZZ_NIGHTLY, a date: AddressSanitizer
      # is a nightly flag, and only this and ci.yml's fuzz-smoke take one.
      - name: Install the fuzzer's nightly, pinned to a date
        run: make fuzz-toolchain

      - name: Fuzz ${{ matrix.target }} for 30 minutes
        env:
          ASAN_OPTIONS: log_path=${{ runner.temp }}/asan
        run: >-
          make fuzz ASAN=1 TARGET=${{ matrix.target }} FUZZ_SECONDS=1800
          FUZZ_FLAGS="--private --corpus none --seed ${{ github.run_number }}"

      - name: Say how to make what it found again
        if: failure()
        run: |
          echo "fennec-fuzz found something in ${{ matrix.target }} at $GITHUB_SHA. Its input is kept nowhere:"
          echo "check out $GITHUB_SHA, run 'make fuzz-seeds' and 'make fuzz ASAN=1', then the line"
          echo "'fennec-fuzz reproduce ...' above with target/<host>/fuzz/fennec-fuzz, and report what"
          echo "it finds privately, as SECURITY.md asks (docs/design/conventions.md#fuzzing)."
