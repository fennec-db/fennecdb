# A power cut under Windows, as docs/design/windows.md's decision 9 asks
# before a Windows release: the release's fennec-server.exe under
# `--sync always` in a Windows Server 2025 guest (QEMU/KVM on the runner,
# installed unattended from Microsoft's evaluation ISO), cut by `kill -9` of
# QEMU at a random time while a client on the host writes to it, five times;
# after each the guest boots, the server opens the same file and every write
# it acknowledged is checked there, whole, no batch half there. Two of the
# cuts also lose the disk's volatile cache: the disk rebuilt as of the last
# flush the guest asked for (QEMU's blklogwrites, replay.py), checked the
# same way. .github/windows-power-cut/ holds the rig, .github/power-cut/
# the host's files linux-power-cut.yml runs too.
#
# About half an hour, so never on a pull request and not a required check:
# by hand, weekly, and on a push to main that touches the durability code --
# the file and its flushes (fs, fs/windows), the sync log, the engine's
# flush and commit (engine.rs, its handover and the maintenance beside it)
# and the lock. A Windows release needs its last run green (RELEASING.md).
name: windows power cut

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
  push:
    branches: [main]
    paths:
      - 'crates/fennec-core/src/fs.rs'
      - 'crates/fennec-core/src/fs/**'
      - 'crates/fennec-core/src/synclog.rs'
      - 'crates/fennec-core/src/engine.rs'
      - 'crates/fennec-core/src/engine/handover.rs'
      - 'crates/fennec-core/src/engine/maintenance.rs'
      - 'crates/fennec-abi/src/lock.rs'
      - '.github/windows-power-cut/**'
      - '.github/power-cut/**'
      - '.github/workflows/windows-power-cut.yml'

permissions:
  contents: read

concurrency:
  group: windows-power-cut-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # The release's own zip, as release.yml makes it: MSVC, the C runtime
  # linked in. Built beside the guest's download and install, which take
  # longer, so it costs the run no time.
  exe:
    name: fennec-server.exe (the release zip, x86_64-pc-windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          rustup show
          rustup target add x86_64-pc-windows-msvc
      - name: The zip, as release.yml makes it
        run: tools/windows-zip.sh "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" x86_64-pc-windows-msvc dist
      - uses: actions/upload-artifact@v7
        with:
          name: fennec-windows-zip
          path: dist/*.zip
          retention-days: 3
          if-no-files-found: error

  vm:
    name: Windows guest, cut five times
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      # `gh run download` of the zip the job beside this one uploads, while
      # this one installs the guest: a `needs:` would wait for it first.
      actions: read
    env:
      # Windows Server 2025 evaluation, en-US, straight from Microsoft's
      # evaluation centre: no sign-in behind the link. The SHA-256 is pinned
      # from the first download (Microsoft publishes none for it). Not
      # cached: 6 GB, and the repository's caches are full.
      ISO_URL: 'https://go.microsoft.com/fwlink/?linkid=2293312&clcid=0x409&culture=en-us&country=us'
      ISO_SHA256: d0ef4502e350e3c6c53c15b1b3020d38a5ded011bf04998e950720ac8579b23d
      SEED: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The runner
        run: |
          echo "cpus $(nproc)"; free -g | head -2; df -h / /mnt 2>/dev/null || df -h /
          lscpu | grep -iE 'model name|virtualization|hypervisor'
          if [ -d /mnt ] && [ "$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)" -gt 30 ]; then
            VM=/mnt/vm; sudo mkdir -p "$VM"; sudo chown "$(id -u):$(id -g)" "$VM"
          else
            VM=$RUNNER_TEMP/vm; mkdir -p "$VM"
          fi
          echo "VM=$VM" >> "$GITHUB_ENV"
          # The server's token: made here, a file only the runner's user
          # reads, copied into the guest; never printed.
          (umask 077; python3 -c 'import secrets, sys; sys.stdout.write(secrets.token_urlsafe(32))' > "$VM/token")
      - name: KVM for the runner's user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: QEMU and the tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils genisoimage sshpass socat >/dev/null
          qemu-system-x86_64 --version | head -1
      - name: The evaluation ISO
        run: |
          t0=$(date +%s)
          curl -sS -L --fail --retry 3 -o "$VM/win.iso" "$ISO_URL"
          echo "TIMING iso_download=$(( $(date +%s) - t0 ))s" | tee -a "$VM/summary.txt"
          sum=$(sha256sum "$VM/win.iso" | cut -d' ' -f1)
          if [ "$sum" != "$ISO_SHA256" ]; then echo "ISO sha256 $sum, pinned $ISO_SHA256"; exit 1; fi
      - name: Install, unattended, to the first command
        timeout-minutes: 40
        run: .github/windows-power-cut/vm.sh install
      - name: The release's fennec-server.exe in the guest, serving
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/windows-power-cut/vm.sh fennec
      - name: Cut 1, the disk as QEMU left it
        timeout-minutes: 15
        run: .github/windows-power-cut/vm.sh cut 1 plain log
      - name: Cut 2, and the disk as of its last flush
        timeout-minutes: 20
        run: .github/windows-power-cut/vm.sh cut 2 lost plain
      - name: Cut 3, the disk as QEMU left it
        timeout-minutes: 15
        run: .github/windows-power-cut/vm.sh cut 3 plain log
      - name: Cut 4, and the disk as of its last flush
        timeout-minutes: 20
        run: .github/windows-power-cut/vm.sh cut 4 lost plain
      - name: Cut 5, the disk as QEMU left it
        timeout-minutes: 15
        run: .github/windows-power-cut/vm.sh cut 5 plain plain
      - name: What each cut found
        if: always()
        run: .github/windows-power-cut/vm.sh summary || true
      - name: Stop QEMU
        if: always()
        run: |
          if [ -f "$VM/qemu.pid" ]; then kill -9 "$(cat "$VM/qemu.pid")" 2>/dev/null || true; fi
      # The guest's screens and serial log, the client's record of every
      # write and each check, the server's output: never the token, the
      # disks or the write logs.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: power-cut-logs
          path: |
            ${{ env.VM }}/shots/
            ${{ env.VM }}/serial.log
            ${{ env.VM }}/summary.txt
            ${{ env.VM }}/state/
            ${{ env.VM }}/load-*.log
            ${{ env.VM }}/check-*.log
            ${{ env.VM }}/server-*.log
            ${{ env.VM }}/replay-*.log
          retention-days: 7
          if-no-files-found: ignore
