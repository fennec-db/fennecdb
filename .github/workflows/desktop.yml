name: desktop

# fennec studio as a desktop app (integrations/studio-desktop, beta, macOS on
# Apple silicon): the bundled fennec-server and the app built, the DMG a user
# downloads made and held as it ships, the unit tests and every scripted check
# run against the app on a macOS runner, which has the window server they
# drive. Nothing here is a required check: a change outside these paths cannot
# break the app, and the macOS minutes are spent only where it could.
#
# WINDOWS AND LINUX (`other-systems`, phase 1 of the plan in #578): the same
# app, the shipped build and the test variant, built on windows-latest,
# windows-11-arm, ubuntu-24.04 and ubuntu-24.04-arm with a release's server
# and shell (scripts/get-server.sh, the asset checked against the release's
# SHA256SUMS), type-checked, unit-tested, and driven through the scripted
# checks that run there (Linux's under xvfb-run, on a D-Bus session with
# gnome-keyring's Secret Service unlocked). scripts/checks/run.mjs says which
# checks a system skips, each with its reason and the phase that brings it.
# Nothing they build is shipped or attached; no other job needs them.
#
# THE DOWNLOAD is unsigned until there is a Developer ID: the app unpacked
# and signed ad hoc as a whole (scripts/dist.sh says why it cannot ship as
# Electrobun's self-extractor), in a DMG, as the Windows zip ships unsigned.
# Started by hand from main with a release's tag (`release: v0.2.0`), the
# `app` job builds it with that release's server (its tarball checked against
# the release's SHA256SUMS), runs every check on it, and, where the signing
# job below signs nothing, `attach-unsigned` attaches it to the release as
# fennec-studio-v<version>-macos-arm64.dmg and appends its line to the
# release's SHA256SUMS, which only grows: every line it had is kept byte for
# byte, and an asset of that name is never replaced. That job holds the only
# write permission it needs and no secret; a dispatch from another branch
# attaches nothing. `curl -fsSL https://fennecdb.com/install.sh | sh -s --
# --app` installs it by that line.
#
# SIGNING is deliberate, and a maintainer's: the `sign` job runs only when this
# workflow is started by hand (workflow_dispatch) from main, in the GitHub
# Environment `desktop-signing`, and only if that Environment holds every
# secret below; otherwise it ends at its first step with a notice. A pull
# request, a push, or a dispatch from another branch never reaches a secret.
#
# What a maintainer sets up, once, IN THIS ORDER (RELEASING.md has the commands):
#   1. The Environment, with its rules, FIRST: Settings > Environments > New
#      environment: `desktop-signing`, a required reviewer (so a dispatch waits
#      for a person) and deployment branches limited to `main` (so the code that
#      is signed is main's). A secret added to an Environment that has no rules
#      yet is readable by any job that names it, from any branch.
#   2. Then, in that Environment, not in the repository's secrets, so that no
#      other job can read them:
#        ELECTROBUN_DEVELOPER_ID      the certificate's name, "Developer ID Application: Name (TEAMID)"
#        MACOS_CERTIFICATE_P12        that certificate and its key, a .p12 file, base64
#        MACOS_CERTIFICATE_PASSWORD   the .p12's password
#        ELECTROBUN_APPLEAPIKEY       an App Store Connect API key's id
#        ELECTROBUN_APPLEAPIISSUER    its issuer id
#        ELECTROBUN_APPLEAPIKEY_P8    its AuthKey_<id>.p8 file, base64 (written to a file in the
#                                     runner's temp directory, whose path is ELECTROBUN_APPLEAPIKEYPATH)
#
# The signing job's first step asks GitHub for the Environment's rules with the
# job's own token and fails, before anything else, unless it has a required
# reviewer and deployment branches limited to `main` alone. Whether that token
# may read them is GitHub's to say (the Environments API asks for administration
# rights, which a workflow's token cannot be given): where it may not, the step
# says so in a warning and goes on, and the order above is all that stands
# between a secret and a job without rules. The job still ends at its next step
# if a secret is missing.
#
# Started by hand with a release's tag (`release: v0.1.12`), the signing job
# bundles that release's server (its SHA-256 checked against the release's
# SHA256SUMS), builds the app signed and notarized, holds the result to what
# Gatekeeper would (codesign, spctl, stapler) and to the same hook check the
# unsigned build passes, and uploads the DMG; a separate job, which holds a
# write permission and none of the secrets, attaches that DMG to the release.
# A signed DMG wins: the unsigned one is attached only where the signing job
# ran and signed nothing (no secrets), never beside a signed one, and never
# where that job failed. The README in integrations/studio-desktop lists what
# a first signed build still has to be verified for.
on:
  pull_request:
    paths:
      - 'integrations/studio-desktop/**'
      - 'studio/**'
      # The server and the shell the app bundles are built from these (each
      # crate either binary depends on, and the lock that pins them), and the
      # studio's pages are embedded in the server by fennec-http.
      - 'crates/fennec-server/**'
      - 'crates/fennec-cli/**'
      - 'crates/fennec-http/**'
      - 'crates/fennec-core/**'
      - 'crates/fennec-ql/**'
      - 'crates/fennec-abi/**'
      - 'crates/fennec-import/**'
      - 'crates/fennec-wire/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/desktop.yml'
      # The installer's --app path, which the app job runs on the DMG it makes.
      - 'site/install.sh'
      - 'site/test_install.sh'
  push:
    branches: [main]
    paths:
      - 'integrations/studio-desktop/**'
      - 'studio/**'
      # The server and the shell the app bundles are built from these (each
      # crate either binary depends on, and the lock that pins them), and the
      # studio's pages are embedded in the server by fennec-http.
      - 'crates/fennec-server/**'
      - 'crates/fennec-cli/**'
      - 'crates/fennec-http/**'
      - 'crates/fennec-core/**'
      - 'crates/fennec-ql/**'
      - 'crates/fennec-abi/**'
      - 'crates/fennec-import/**'
      - 'crates/fennec-wire/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/desktop.yml'
      - 'site/install.sh'
      - 'site/test_install.sh'
  workflow_dispatch:
    inputs:
      release:
        description: 'A release tag (v0.2.0) to bundle the server of and attach the DMG to: signed where the desktop-signing Environment holds the secrets, unsigned (ad hoc) where it does not; from main only. Empty: this checkout, nothing attached.'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  app:
    name: app (build, unit tests, checks)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Where the checks keep their data, reports and logs, so a failure can upload them.
      - name: Where the checks write
        run: echo "SD_DIR=$RUNNER_TEMP/fennec-desktop-checks" >> "$GITHUB_ENV"

      - name: Install the pinned toolchain
        run: rustup show

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: macos-latest-desktop-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: macos-latest-desktop-cargo-

      # The build tool (Hutch, its Bun, the Electrobun runtime) goes into this
      # directory, not the home one (scripts/electrobun.mjs), 130 to 210 MB
      # that Electrobun's own release hosts and the checks need not fetch again.
      # scripts/electrobun.mjs holds what is in it to hutch-pin.json on every
      # run, so a restored cache is not trusted for being one.
      - uses: actions/cache@v6
        with:
          path: integrations/studio-desktop/.hutch-home
          key: desktop-hutch-${{ hashFiles('integrations/studio-desktop/package-lock.json', 'integrations/studio-desktop/hutch.config.ts', 'integrations/studio-desktop/hutch-pin.json') }}

      # The saved servers' tokens go to the Keychain, which the checks
      # exercise: a keychain of their own, unlocked, the default.
      - name: A keychain for the checks
        run: |
          security create-keychain -p '' "$RUNNER_TEMP/checks.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/checks.keychain-db"
          security unlock-keychain -p '' "$RUNNER_TEMP/checks.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/checks.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/checks.keychain-db"

      # A dispatch naming a release builds with that release's server and
      # shell, the app that is attached to it; anything else with this
      # checkout's. The input goes into a make variable, which make expands
      # (`$(shell ...)`), and into a release's name: only a release's name
      # gets past this.
      - name: The server to bundle
        id: server
        env:
          RELEASE: ${{ github.event.inputs.release }}
        run: |
          set -eu
          if [ -n "$RELEASE" ] && ! printf '%s' "$RELEASE" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release is a tag such as v0.2.0"
            exit 1
          fi
          echo "version=${RELEASE#v}" >> "$GITHUB_OUTPUT"
          if [ -n "$RELEASE" ]; then echo "the server and shell of release v${RELEASE#v}, checked against its SHA256SUMS"; else echo "the server and shell of this checkout"; fi

      # The server and the shell (scripts/get-server.sh: a release's tarball
      # checked against its SHA256SUMS, or this checkout built), the release
      # app, the DMG made from it and held as it ships (scripts/dist.sh,
      # checks/dist.mjs), the sources type-checked and the unit tests, the test
      # variant, and the checks. No signing variable is set here, so the build
      # is unsigned, and the DMG's app is signed ad hoc.
      - name: Build and check
        timeout-minutes: 35
        env:
          STUDIO_SERVER: ${{ steps.server.outputs.version }}
        run: make studio-desktop-test STUDIO_SERVER="$STUDIO_SERVER"

      # The installer's --app path on this very DMG: a release of the test's own
      # served from localhost, the app installed into a home of its own, again
      # over itself, refused while it runs, and a tampered DMG refused.
      - name: install.sh --app installs this DMG
        run: FENNEC_TEST_DMG="$PWD/integrations/studio-desktop/artifacts/dist/fennec-studio-macos-arm64.dmg" sh site/test_install.sh

      - name: The logs of the checks
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-check-logs
          path: ${{ runner.temp }}/fennec-desktop-checks/logs
          retention-days: 14
          if-no-files-found: ignore

      # The DMG as it ships, unpacked and signed ad hoc: for a reviewer to try,
      # and what `attach-unsigned` attaches to a release. A browser's download
      # of it is quarantined, and macOS asks once (Open Anyway in System
      # Settings, or `xattr -cr` on the app); install.sh's curl does not
      # quarantine it.
      - name: The unsigned DMG
        uses: actions/upload-artifact@v7
        with:
          name: fennec-studio-unsigned-dmg
          path: integrations/studio-desktop/artifacts/dist/fennec-studio-macos-arm64.dmg
          retention-days: 7
          if-no-files-found: error

  # Windows and Linux (the header): built and checked, nothing shipped. A
  # dispatch that names a release is a maintainer attaching the Mac's DMG, and
  # skips them.
  other-systems:
    name: app on ${{ matrix.name }} (build, unit tests, checks)
    if: github.event.inputs.release == ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest }
          - { name: Windows arm64, os: windows-11-arm }
          - { name: Linux x64, os: ubuntu-24.04 }
          - { name: Linux arm64, os: ubuntu-24.04-arm }
    defaults:
      run:
        # Git's bash on Windows: scripts/get-server.sh is a shell script, and the steps read alike.
        shell: bash
        working-directory: integrations/studio-desktop
    env:
      # The release whose server and shell these jobs bundle, its asset checked against its
      # SHA256SUMS. The macOS job bundles this checkout's; here the app is what is under test.
      STUDIO_SERVER_RELEASE: '0.2.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Where the checks keep their data, reports and logs, so a failure can upload them.
      - name: Where the checks write
        run: echo "SD_DIR=$RUNNER_TEMP/fennec-desktop-checks" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # What the app links on Linux (WebKitGTK 4.1, GTK 3, AppIndicator, librsvg: Ubuntu
      # 24.04 calls GTK 3 libgtk-3-0t64), and what the checks drive it with: an X server
      # (xvfb), a session bus, a Secret Service (gnome-keyring) for Bun.secrets, whose
      # items secret-tool clears, and xdg-open, which the app hands links and folders to
      # (checks/opener.mjs runs it for real).
      - name: Linux packages
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        # From the image's package lists, as ci.yml installs brotli; lists gone stale are
        # fetched again. A mirror the runner's resolver does not answer for is asked of
        # 1.1.1.1 and written into /etc/hosts: on 2026-11-11 Azure's (168.63.129.16) timed
        # out on every *.ubuntu.com name for hours while it answered for github.com, and
        # apt waited on each mirror until the step's time ran out.
        run: |
          mirrors=$( { sed -n 's|^[a-z]*://\([^/]*\)/.*|\1|p' /etc/apt/apt-mirrors.txt 2>/dev/null; sed -n 's|^URIs: *[a-z]*://\([^/ ]*\).*|\1|p' /etc/apt/sources.list.d/*.sources 2>/dev/null; } | sort -u)
          for h in $mirrors; do
            timeout 5 getent hosts "$h" >/dev/null && continue
            echo "$h: not resolved here, asked of 1.1.1.1"
            for a in $(dig +short +time=3 +tries=2 @1.1.1.1 "$h" A | grep -E '^[0-9.]+$'); do echo "$a $h"; done | sudo tee -a /etc/hosts
          done
          packages="libgtk-3-0t64 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 librsvg2-2 xvfb dbus-x11 gnome-keyring libsecret-1-0 libsecret-tools xdg-utils"
          sudo -E apt-get install -y -q $packages || { sudo -E apt-get update -q && sudo -E apt-get install -y -q $packages; }

      # As the macOS job's, a cache per system: scripts/electrobun.mjs holds what is
      # in it to hutch-pin.json on every run.
      - uses: actions/cache@v6
        with:
          path: integrations/studio-desktop/.hutch-home
          key: desktop-hutch-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('integrations/studio-desktop/package-lock.json', 'integrations/studio-desktop/hutch.config.ts', 'integrations/studio-desktop/hutch-pin.json') }}

      - name: npm ci
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error

      - name: The server and shell of the release, checked against its SHA256SUMS
        run: sh scripts/get-server.sh "$STUDIO_SERVER_RELEASE"

      - name: Build the shipped app
        run: npm run build

      - name: Type check and unit tests
        run: npm run typecheck && node --test --test-reporter=spec test/*.test.ts

      - name: Build the test variant
        run: FENNEC_DESKTOP_TEST_BUILD=1 npm run build

      - name: The scripted checks
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            # A session bus of its own, gnome-keyring's login keyring made and unlocked on it
            # (its password on stdin), and an X display: what a desktop session gives the app.
            dbus-run-session -- sh -c 'printf checks | gnome-keyring-daemon --unlock --components=secrets >/dev/null && xvfb-run -a -s "-screen 0 1600x1000x24" node scripts/checks/run.mjs'
          else
            node scripts/checks/run.mjs
          fi

      - name: The logs of the checks
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-check-logs-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/fennec-desktop-checks/logs
          retention-days: 14
          if-no-files-found: ignore

  sign:
    name: sign and notarize
    needs: app
    # By hand, from main: a dispatch of another branch would sign that branch's
    # code with the certificate. (The Environment's own branch rule says the
    # same where a maintainer set it.)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 60
    environment: desktop-signing
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.done.outputs.signed }}
    env:
      # A secret cannot be tested in a step's `if`; this says whether they are all there.
      HAVE: ${{ secrets.ELECTROBUN_DEVELOPER_ID != '' && secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.ELECTROBUN_APPLEAPIKEY != '' && secrets.ELECTROBUN_APPLEAPIISSUER != '' && secrets.ELECTROBUN_APPLEAPIKEY_P8 != '' }}
      # And whether any one is: the rules guard a secret, so they are checked
      # wherever even one is there.
      ANY: ${{ secrets.ELECTROBUN_DEVELOPER_ID != '' || secrets.MACOS_CERTIFICATE_P12 != '' || secrets.MACOS_CERTIFICATE_PASSWORD != '' || secrets.ELECTROBUN_APPLEAPIKEY != '' || secrets.ELECTROBUN_APPLEAPIISSUER != '' || secrets.ELECTROBUN_APPLEAPIKEY_P8 != '' }}
      RELEASE: ${{ github.event.inputs.release }}
    steps:
      # First of all, before a secret is used for anything: does the Environment
      # have the rules the comment above asks for?
      - name: The Environment has a reviewer and is limited to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          # The first job that names the Environment makes it, with no rules;
          # with no secret in it there is nothing for them to guard, and failing
          # here would stop the unsigned DMG, which waits on this job.
          if [ "$ANY" != true ]; then
            echo "the Environment desktop-signing holds no signing secret, so there is nothing for its rules to guard: not checked"
            exit 0
          fi
          api="repos/$GITHUB_REPOSITORY/environments/desktop-signing"
          if ! environment=$(gh api "$api" 2>"$RUNNER_TEMP/rules.err") || ! policies=$(gh api "$api/deployment-branch-policies" 2>>"$RUNNER_TEMP/rules.err"); then
            echo "::warning::the job's token cannot read the rules of the Environment desktop-signing ($(tr '\n' ' ' < "$RUNNER_TEMP/rules.err" | cut -c1-160)), so they are not checked here: they must have been set up before the secrets were (see the header of this workflow and RELEASING.md)"
            exit 0
          fi
          problems=""
          custom=$(printf '%s' "$environment" | jq -r '.deployment_branch_policy.custom_branch_policies // false')
          [ "$custom" = true ] || problems="$problems deployment branches are not limited to selected branches;"
          names=$(printf '%s' "$policies" | jq -r '[.branch_policies[]? | select((.type // "branch") == "branch") | .name] | sort | join(",")')
          [ "$names" = main ] || problems="$problems the branches allowed are '$names', not main alone;"
          reviewers=$(printf '%s' "$environment" | jq '[.protection_rules[]? | select(.type == "required_reviewers") | (.reviewers // []) | length] | add // 0')
          [ "$reviewers" -gt 0 ] || problems="$problems no required reviewer;"
          if [ -n "$problems" ]; then
            echo "::error::the Environment desktop-signing is not set up as the header of this workflow says:$problems nothing is signed. Set its rules first, then its secrets (RELEASING.md)."
            exit 1
          fi
          echo "the Environment has $reviewers required reviewer(s) and is limited to: $names"

      - name: Are the signing secrets in the Environment?
        id: have
        run: |
          echo "available=$HAVE" >> "$GITHUB_OUTPUT"
          if [ "$HAVE" != true ]; then
            echo "::notice::the Environment desktop-signing does not hold all six signing secrets, so nothing is signed (see the header of this workflow)"
          fi

      # The input goes into a make variable, which make expands (`$(shell ...)`),
      # and into a release's name: only a release's name gets past this.
      - name: The release asked for is a release's name
        id: release
        if: steps.have.outputs.available == 'true'
        run: |
          set -eu
          if [ -n "$RELEASE" ] && ! printf '%s' "$RELEASE" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release is a tag such as v0.1.12"
            exit 1
          fi
          echo "version=${RELEASE#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.have.outputs.available == 'true'
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        if: steps.have.outputs.available == 'true'
        run: rustup show

      - uses: actions/setup-node@v7
        if: steps.have.outputs.available == 'true'
        with:
          node-version: '22'

      # No cache here: this job holds the secrets, and what a cache restores was
      # written by runs that do not.

      # The certificate goes into a keychain of its own, which is deleted at
      # the end, and may be used by `codesign` and `security`, not by any
      # program (`-A` would). The key file for notarization goes into the
      # runner's temp directory.
      - name: Import the certificate
        if: steps.have.outputs.available == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          ELECTROBUN_APPLEAPIKEY_P8: ${{ secrets.ELECTROBUN_APPLEAPIKEY_P8 }}
        run: |
          set -eu
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass=$(uuidgen)
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -f pkcs12 -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain
          rm -f "$RUNNER_TEMP/certificate.p12"
          echo "$ELECTROBUN_APPLEAPIKEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, sign and notarize
        if: steps.have.outputs.available == 'true'
        timeout-minutes: 45
        env:
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
          ELECTROBUN_APPLEAPIKEY: ${{ secrets.ELECTROBUN_APPLEAPIKEY }}
          ELECTROBUN_APPLEAPIISSUER: ${{ secrets.ELECTROBUN_APPLEAPIISSUER }}
          STUDIO_SERVER: ${{ steps.release.outputs.version }}
        run: |
          set -eu
          export ELECTROBUN_APPLEAPIKEYPATH="$RUNNER_TEMP/AuthKey.p8"
          # A release's own server, its SHA-256 checked against the release's
          # SHA256SUMS, when a release is named; this checkout's otherwise.
          make studio-desktop STUDIO_SERVER="$STUDIO_SERVER"

      # The same hook check the unsigned build passes, on the bundle that ships.
      - name: The signed bundle holds none of the test hooks
        if: steps.have.outputs.available == 'true'
        run: node integrations/studio-desktop/scripts/checks/release.mjs

      # What Gatekeeper will say on a Mac that has never seen this app, asked
      # here: the signature, the hardened runtime and the Developer ID on the
      # bundled fennec-server and fennec shell (each its own grep: one is not the
      # other), and the notarization ticket stapled to the app and to the DMG.
      - name: Hold the result to what Gatekeeper checks
        if: steps.have.outputs.available == 'true'
        run: |
          set -eu
          cd integrations/studio-desktop
          app="build/stable-macos-arm64/fennec studio.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          for bin in fennec-server fennec; do
            codesign -dv --verbose=4 "$app/Contents/Resources/app/bin/$bin" > "$RUNNER_TEMP/$bin-signature.txt" 2>&1
            cat "$RUNNER_TEMP/$bin-signature.txt"
            grep -E 'flags=.*runtime' "$RUNNER_TEMP/$bin-signature.txt"
            grep -F 'Authority=Developer ID Application' "$RUNNER_TEMP/$bin-signature.txt"
          done
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          for dmg in artifacts/*.dmg; do
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          done

      - uses: actions/upload-artifact@v7
        if: steps.have.outputs.available == 'true'
        with:
          name: fennec-studio-signed-dmg
          path: integrations/studio-desktop/artifacts/*.dmg
          retention-days: 30
          if-no-files-found: error

      - name: Signed
        id: done
        if: steps.have.outputs.available == 'true'
        run: echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Remove the certificate and the key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/certificate.p12"

  # One of the two jobs with permission to write to the repository (the other,
  # attach-unsigned, never runs beside it), and it holds no secret and runs
  # nothing from a download but `gh`: a DMG that passed the signing job's
  # checks, and a release it names.
  attach:
    name: attach the signed DMG to the release
    needs: sign
    if: needs.sign.outputs.signed == 'true' && github.event.inputs.release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: fennec-studio-signed-dmg
          path: dist

      - name: Attach
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ github.event.inputs.release }}
        run: |
          set -eu
          printf '%s' "$RELEASE" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::release is a tag such as v0.1.12"; exit 1; }
          version="${RELEASE#v}"
          for dmg in dist/*.dmg; do
            mv "$dmg" "dist/fennec-studio-v$version-$(basename "$dmg")"
          done
          gh release upload "v$version" dist/fennec-studio-v"$version"-*.dmg --clobber -R "$GITHUB_REPOSITORY"

  # The unsigned DMG, where nothing signed one: a dispatch from main naming a
  # release, whose signing job ran and found no secrets (signed wins; a signing
  # job that failed, or was not approved, attaches nothing). Like `attach`, it
  # holds the write permission and no secret, checks nothing out and runs
  # nothing but `gh`. The DMG is the one the app job built with that release's
  # server and held to every check. Its line is appended to the release's
  # SHA256SUMS, which is how install.sh finds and checks it: every line the
  # file had is kept byte for byte (`cmp` holds it, and the file is read back),
  # so no sum anyone took from it changes, and an asset of the DMG's name is
  # never replaced -- one there already is this run's (a re-run, its SHA-256
  # the same) or the job fails. A published release's other assets are
  # release.yml's and are not touched. While `--clobber` replaces
  # SHA256SUMS (a delete, then an upload: GitHub cannot write an asset in
  # place) the release has none for a moment, and an install then fails
  # saying so; one at a time per release (`concurrency`).
  attach-unsigned:
    name: attach the unsigned DMG to the release
    needs: [app, sign]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.release != '' && needs.sign.outputs.signed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: desktop-attach-${{ github.event.inputs.release }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: fennec-studio-unsigned-dmg
          path: dist

      - name: Attach, its line appended to SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ github.event.inputs.release }}
        run: |
          set -eu
          printf '%s' "$RELEASE" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::release is a tag such as v0.2.0"; exit 1; }
          version="${RELEASE#v}"
          tag="v$version"
          name="fennec-studio-v$version-macos-arm64.dmg"
          [ -f dist/fennec-studio-macos-arm64.dmg ] || { echo "::error::the app job's artifact holds no fennec-studio-macos-arm64.dmg"; exit 1; }
          mv dist/fennec-studio-macos-arm64.dmg "dist/$name"
          sum=$(cd dist && sha256sum "$name" | cut -d' ' -f1)
          echo "$name: $(wc -c < "dist/$name") bytes, SHA-256 $sum"

          have=$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          printf '%s\n' "$have" | grep -qxF SHA256SUMS || { echo "::error::release $tag has no SHA256SUMS to list the DMG in"; exit 1; }
          mkdir -p release readback
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -D release
          listed=$(awk -v n="$name" '{ f = $2; sub(/^\*/, "", f); if (f == n) print $1 }' release/SHA256SUMS)

          # The DMG: uploaded, or this run's there already (a re-run).
          if printf '%s\n' "$have" | grep -qxF "$name"; then
            gh release download "$tag" -R "$GITHUB_REPOSITORY" -p "$name" -D release
            [ "$(sha256sum "release/$name" | cut -d' ' -f1)" = "$sum" ] || { echo "::error::release $tag has a $name already, not this run's: a release's assets are never replaced"; exit 1; }
            echo "$name is on the release already, this run's"
          else
            gh release upload "$tag" "dist/$name" -R "$GITHUB_REPOSITORY"
          fi

          # Its line: there already with this sum, or appended.
          if [ -n "$listed" ]; then
            [ "$listed" = "$sum" ] || { echo "::error::SHA256SUMS lists $name with $listed, not $sum"; exit 1; }
            echo "SHA256SUMS lists it already"
            exit 0
          fi
          cp release/SHA256SUMS dist/SHA256SUMS
          [ -z "$(tail -c 1 dist/SHA256SUMS)" ] || echo >> dist/SHA256SUMS
          printf '%s  %s\n' "$sum" "$name" >> dist/SHA256SUMS
          old=$(wc -c < release/SHA256SUMS)
          cmp -n "$old" release/SHA256SUMS dist/SHA256SUMS
          [ "$(grep -c . dist/SHA256SUMS)" -eq "$(( $(grep -c . release/SHA256SUMS) + 1 ))" ]
          gh release upload "$tag" dist/SHA256SUMS --clobber -R "$GITHUB_REPOSITORY"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -D readback
          cmp dist/SHA256SUMS readback/SHA256SUMS
          echo "SHA256SUMS of $tag now ends with:"
          tail -n 1 readback/SHA256SUMS
          {
            echo "### $name attached to $tag"
            echo
            echo "$(wc -c < "dist/$name") bytes, SHA-256 \`$sum\`, listed in the release's SHA256SUMS."
          } >> "$GITHUB_STEP_SUMMARY"
