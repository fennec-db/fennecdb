name: ci

# main moves only through the merge queue, and a merge group's head is the
# very commit main then holds: a run on every push to main tested again what
# the group had (14 landings in 14 hours on 2026-11-14, each three runs of
# about 28 jobs, the merge groups dropped at the queue's 60-minute timeout
# behind that backlog). So a push starts this workflow only when an input of
# a cache moved, or the workflow itself: a run on main is the only one whose
# caches other branches may restore (a pull request's and a merge group's are
# scoped to their own refs). Every cache is restored by every run and saved by
# the runs on main alone (`actions/cache/restore`, and a `save` step under
# `github.ref == 'refs/heads/main'`), so the entries a pull request would save
# for itself, and that push main's out of the 10 GB, are never made. The caches
# and their inputs:
#   - the 21 cargo cache steps: Cargo.lock and rust-toolchain.toml (the one
#     Unicode table step is keyed by its version, pinned here);
#   - the Grafana job's npm and Go caches: its package-lock.json, go.mod and
#     go.sum;
#   - no Flutter cache: it cost more of the cap than the download it saved;
#   - setup-gradle: its key is the job and the commit, not a file's hash, and
#     only main writes it (`cache-read-only` off the default branch), so what
#     it holds is as old as main's last run; the Gradle build files, the
#     Groovy and Kotlin ones and gradle.properties, decide what is worth
#     holding, so a change to one starts a run. There is no
#     gradle-wrapper.properties and no libs.versions.toml in the repository
#     today (the Gradle version is pinned here): add either to `paths` the
#     day one appears.
# The schedule is main's whole run in between, for what comes with time
# (runner and base images, the badge, the flake ledger's view of main) and as
# the backstop for a cache GitHub evicted (unused for 7 days, or past the
# 10 GB limit), twice a day, not every six hours: each run is about 170
# job-minutes of the 20 slots, and a drift found within 12 hours is as good as
# within 6. Minute 17, as a scheduled run at the top of an hour is the one
# GitHub delays or drops.
on:
  push:
    branches: [main]
    paths:
      - '**/Cargo.lock'
      - rust-toolchain.toml
      - .github/workflows/ci.yml
      - integrations/grafana/package-lock.json
      - integrations/grafana/go.mod
      - integrations/grafana/go.sum
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/gradle.properties'
  schedule:
    - cron: '17 4,16 * * *'
  pull_request:
  # The merge queue tests each pull request as it would land on main, with
  # the ones queued before it: two that pass apart can fail together (#292
  # and #293 each held the studio's quoted size, and together passed it).
  merge_group:
  workflow_dispatch:

# A pull request's or main's newer commit ends the run of the one before it:
# a run is about 170 job-minutes, the account runs 20 jobs at once, and on
# 2026-11-13 32 runs stood queued behind superseded ones, each a fix pushed
# over its own still-running predecessor. A merge group is never cancelled:
# each has its own ref, and the queue waits on its result.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

env:
  CARGO_TERM_COLOR: always

# Every job is bounded (`timeout-minutes`): the next 5 minutes at or above
# both twice its median and its slowest plus 2 minutes, over 100 green runs
# (2026-11-13). Unbounded, a hang held its runner the 6 hours GitHub allows
# -- windows (http) hung five times in a week, a follower's halt waiting for
# a thread that read on (docs/design/replication.md#replication). A job
# that grows past its bound moves the bound in the same change.
jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: |
          rustup show
          rustup component add rustfmt

      - run: cargo fmt --all --check

      # docs/design/text.md#tokenizer: the accent fold's table is written by
      # its script alone, through rustfmt, from Unicode's UnicodeData.txt --
      # kept by its version, so a run asks unicode.org only on a miss, and
      # held to the checksum gen.py pins either way.
      - id: unicode-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/unicode/17.0.0
          key: unicode-17.0.0-UnicodeData

      - name: The accent fold's table is what tools/fold/gen.py writes
        run: |
          f=~/.cache/unicode/17.0.0/UnicodeData.txt
          test -f "$f" || { mkdir -p "$(dirname "$f")" && curl -fsSL --retry 3 -o "$f" https://www.unicode.org/Public/17.0.0/ucd/UnicodeData.txt; }
          python3 crates/fennec-core/tools/fold/gen.py --check "$f"

      - name: Each AGENTS.md is its CLAUDE.md under its own title; the root under 32 000 bytes, an area file under 24 000, each rule in one file and the root's index
        run: python3 tools/agents_md.py --check

      # docs/design/crates.md#zero-dependencies: only fennec-tls (rustls,
      # ring, webpki-roots) and fennec-bench take crates from outside the
      # workspace, and the browser module's crates reach none, nor fennec-tls.
      - name: Only fennec-tls and fennec-bench take dependencies from outside the workspace
        run: python3 tools/deps_check.py

      # The compiler CI tests with is the one that ships: rust-toolchain.toml
      # names an exact release, and every Dockerfile's rust image is that
      # release, by digest, the toolchain file kept in the build; the images
      # that ship or run the regions' checks name a digest in every FROM.
      - name: rust-toolchain.toml names an exact release, and every image builds with it
        run: |
          python3 tools/test_toolchain_check.py
          python3 tools/toolchain_check.py

      # docs/design/conventions.md#secrets-compared: a token, a secret, a
      # mark, a signature or a password is compared by crypto::ct_eq, never
      # with == or !=; the reader is held to its own cases first.
      - name: No secret is compared with == or != in the crates' sources
        run: |
          python3 tools/secret_eq_check.py --self-test
          python3 tools/secret_eq_check.py

      # docs/design/integrations.md#the-chaos-drill: `test-clock` moves a
      # tenant node's clock by a file, for `make chaos` alone. No crate's
      # default features reach it, no other feature or dependency turns it
      # on, and nothing builds with it but deploy/Dockerfile's chaos stage
      # (release.yml then refuses a binary or an image whose --version says
      # it).
      - name: No build but the chaos image's names a test build's feature
        run: |
          python3 tools/test_release_features_check.py
          python3 tools/release_features_check.py

      # docs/design/benchmarks.md#instruction-counts: the measuring is
      # macOS's and runs by hand (make instr-compare); a copy's UUID, the
      # refusals keeping a build's output untouched, the figures and a
      # trace's deltas are held here.
      - name: tools/instr's UUID copies, figures and trace deltas
        run: python3 tools/instr/test_instr.py

      # docs/design/benchmarks.md#the-gate: the perf job's judgement -- a
      # synthetic +1% fails, a PERF_ACCEPTED entry the pull request adds
      # lets it through, one the base holds does not -- and the entries
      # read as data.
      - name: tools/perf_gate.py fails +1% and lets an entry through
        run: python3 tools/test_perf_gate.py

      # docs/design/integrations.md#flutter-plugin: the check the Flutter
      # plugin's job runs on the packed plugin refuses each way 0.2.0's
      # archive shipped a library again and passes prepare.sh's layout.
      - name: tools/flutter_archive_check.py refuses a library packed twice or for another platform
        run: python3 tools/test_flutter_archive_check.py

      # docs/design/http.md#compatibility: the checker the test job runs on
      # the served documents finds each kind of break, lets each addition
      # through, and holds BREAKS and the committed baseline.
      - name: tools/openapi_compat.py finds every break and passes every addition
        run: python3 tools/test_openapi_compat.py

      # docs/design/fennecql.md#the-corpus: what the test job's corpus steps
      # harvest from each kind of file and the hand-written list, how a
      # reading is judged against another's -- word by word, a panic failing
      # whatever BASE read -- what ACCEPTED lets through -- one change, both
      # readings named, a digest moving or a 1.x release's text refused only
      # with the grammar epoch raised, a 1.x release's statement read
      # otherwise with it or its `same_meaning` -- what a failure prints, the
      # frozen corpora kept as main holds them, and trees of a few lines
      # built in turn, each answering its own reading. The test job runs it
      # too, beside the steps it holds.
      - name: tools/fennecql_corpus.py harvests, judges and lets through only what it must
        run: python3 tools/test_fennecql_corpus.py

      # docs/design/durability.md#a-power-cut: the power cuts run by hand,
      # weekly and on a push to main, never on a pull request; what their
      # shared check must fail -- a sync come late, a write lost past
      # `--sync 250`'s window, a cut with no write in flight, a standby far
      # behind -- is held here on every one.
      - name: The power cut's check fails a late sync, a loss past the window, a cut between writes and a standby far behind
        run: python3 -B .github/power-cut/test_client.py

      # docs/design/conventions.md#coverage: the weekly report's tables over
      # a hand-made export -- a crate's and a boundary's figures, a
      # registry's file left out, a listed path that is gone failing the
      # tool -- and the committed list's paths existing.
      - name: tools/coverage_report.py's tables, and its boundary list's paths
        run: python3 tools/test_coverage_report.py

      - name: Save the cache (main only)
        if: github.ref == 'refs/heads/main' && steps.unicode-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/unicode/17.0.0
          key: ${{ steps.unicode-cache.outputs.cache-primary-key }}

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml names an exact release: a new one, and the lints
      # it brings, comes in a pull request of its own, and shows here first.
      - name: Install the pinned toolchain
        run: |
          rustup show
          rustup component add clippy

      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: v2-ubuntu-latest-clippy-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: v2-ubuntu-latest-clippy-

      - run: cargo clippy --workspace --all-targets -- -D warnings

      # The browser build compiles code the native one does not: the SIMD
      # kernels, the graph builder without threads, fennec-core without
      # std-fs.
      - run: cargo clippy -p fennec-wasm -p fennec-abi -p fennec-core -p fennec-ql --target wasm32-unknown-unknown -- -D warnings

      # A module made without some of its features (`make wasm FEATURES=...`)
      # compiles what the full one does not: the stand-ins in off.rs, the
      # folds of no value, and the engine with its paths through them dead.
      # None, each feature alone, each group; a set of two is each alone's
      # code twice over, which these already compile. A check with no code
      # made: about 10 s a set. And fennec-core's tests and examples without
      # the indexes, and without anything.
      - run: |
          for f in "" vector text sparse sorted composite geo nocase facets highlight analytics collate indexes language; do
            cargo clippy -p fennec-wasm -p fennec-core --target wasm32-unknown-unknown --no-default-features ${f:+--features=$f} -- -D warnings
          done
      - run: cargo clippy -p fennec-core --no-default-features --features std-fs,language --all-targets -- -D warnings
      - run: cargo clippy -p fennec-core --no-default-features --features std-fs --all-targets -- -D warnings

      # What only Windows compiles -- fs/windows.rs and the mapping in
      # views (fs/windows/map.rs), the page cache's room, the lock's
      # kernel32 calls, the archive's flushes, the server's start lines --
      # and what it compiles out, linted here, a check needing no Windows
      # linker: the libraries, fennec-core's tests whole, fennec-abi's unit
      # tests, and fennec-server and fennec without TLS, their console
      # handlers among them. fennec-http's unit tests and TLS need ring's C,
      # which wants MSVC.
      - run: |
          rustup target add x86_64-pc-windows-msvc
          cargo clippy -p fennec-core -p fennec-abi -p fennec-http --lib --target x86_64-pc-windows-msvc -- -D warnings
          cargo clippy -p fennec-core --tests --target x86_64-pc-windows-msvc -- -D warnings
          cargo clippy -p fennec-abi --lib --profile test --target x86_64-pc-windows-msvc -- -D warnings
          cargo clippy -p fennec-server --no-default-features --lib --bins --target x86_64-pc-windows-msvc -- -D warnings
          cargo clippy -p fennec-cli --no-default-features --features import,backup,mcp --bins --target x86_64-pc-windows-msvc -- -D warnings

      # The native library with the JNI functions the Kotlin binding calls,
      # which the workspace's run builds without.
      - run: cargo clippy -p fennec-ffi --features jni --all-targets -- -D warnings

      # A test build's clock (`test-clock`, crates/fennec-http/src/test_clock.rs),
      # which only `make chaos`'s image builds: linted here, its unit test
      # and the server's test of it among the targets, or nothing would
      # compile it before the weekly drill did.
      - run: cargo clippy -p fennec-http -p fennec-server --features test-clock --all-targets -- -D warnings

      # SQL's joins held to what SQLite answers for the same rows: in the
      # bench crate, where SQLite is, which `make test` leaves out. About
      # 32 s to build and 0.3 s to run, with this job's target cached.
      - name: SQL's joins answer what SQLite answers
        run: cargo test -p fennec-bench --test joins_sqlite

      - name: Prune target/ to the crates from outside the workspace (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: sh tools/ci_prune_target.sh

      - name: Save the cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm: the aarch64-linux binaries and image ship, and
        # their NEON, CRC and atomics paths run only on an arm host.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # The installer's --app path, which only a Mac runs: a stand-in DMG
      # served from localhost as a release's, installed into the Applications
      # folder of a home of its own and refused where it must be (the
      # packaging job runs the rest on Linux, desktop.yml the real DMG).
      - name: The installer's Mac app path
        if: matrix.os == 'macos-latest'
        run: sh site/test_install.sh

      # rust-toolchain.toml pins an exact release and asks for
      # wasm32-unknown-unknown; `rustup show` is what installs both before
      # the first cargo call.
      - name: Install the pinned toolchain
        run: rustup show

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: v2-${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: v2-${{ matrix.os }}-cargo-

      # The browser bundle comes first: the JS suites skip themselves on a
      # machine with no web/fennec.wasm and throw under CI (web/ci-prereq.mjs),
      # and `make test` fails on a skipped or ignored test past
      # tools/skips-allowlist.json's count (tools/skips_check.py).
      # The module without the indexes is what web/fennec.test.js hands the
      # full one's files to, and back, and holds its `near` to the full
      # one's `near ... exact`.
      - name: Build WASM
        run: make wasm wasm-lite wasm-min

      # site/build.py holds every size the docs quote against the module just
      # built, and under CI refuses one that drifted. The site is built only
      # on main, so phase 8 grew the module 490 -> 497 KB through two pull
      # requests that passed and a deploy that failed after the merge. One
      # runner is enough: the module is the one the site workflow builds, to
      # the byte, and brotli comes from apt.
      # esbuild bundles the app the docs weigh the client entry by, pinned as
      # the site's deploy pins it. The same build writes the site's search
      # index through the module and fails when a known query does not find
      # its page first (site/search.test.mjs).
      - name: Check the sizes the docs quote, and the site's search
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y --no-install-recommends brotli
          npm install -g esbuild@0.28.2
          python3 site/build.py
          # The studio editor's live highlighter is written from build.py's rules
          # and must colour every statement as the docs do.
          python3 site/test_highlight.py
          python3 site/test_results.py

      # Rust first, then the JS tests -- `cargo test` is also what builds the
      # fennec-server binary that the sync tests run against.
      - name: Test
        run: make test

      # fennec-server's OpenAPI document (`GET /_openapi.json`), as a file's
      # server, a tenant node and a router serve it, read by an OpenAPI
      # linter against the specification: the tests hold it to the routes
      # and to its own `$ref`s, this to OpenAPI 3.1's schema. The test it
      # runs first is make test's, already built.
      - name: The OpenAPI document lints
        if: matrix.os == 'ubuntu-latest'
        run: make openapi-lint

      # docs/design/http.md#compatibility: the REST API only grows. The
      # documents the lint read, held by this checkout's checker to
      # integrations/openapi/ -- an addition the baseline lacks is written
      # into it -- and by main's checker to main's copy of it, so neither a
      # baseline written again past a break nor a checker changed to see
      # less lets one through. main's reads the pull request's BREAKS as
      # data (`--breaks-from`, a literal, never run): a break on purpose is
      # named there. Until main has a checker, its pass holds nothing.
      - name: The REST API only grows
        if: matrix.os == 'ubuntu-latest'
        run: |
          git fetch --no-tags --depth=1 origin main
          python3 tools/openapi_compat.py
          if git cat-file -e FETCH_HEAD:tools/openapi_compat.py; then
            git show FETCH_HEAD:tools/openapi_compat.py > "$RUNNER_TEMP/openapi_compat_main.py"
            python3 -I "$RUNNER_TEMP/openapi_compat_main.py" --root "$PWD" --base-ref FETCH_HEAD \
              --breaks-from tools/openapi_compat.py
          else
            echo "main has no tools/openapi_compat.py yet: no base pass"
          fi

      # The corpus tool's own tests (the fmt job's step), in a required
      # check beside the two steps whose reading and judging they hold.
      - name: tools/fennecql_corpus.py harvests, judges and lets through only what it must
        if: matrix.os == 'ubuntu-latest'
        run: python3 tools/test_fennecql_corpus.py

      # docs/design/fennecql.md#the-corpus: no text that parsed reads as
      # another statement, is refused or panics. Every FennecQL text this
      # tree and main's hold, read by both -- each tree's fennec-ql built
      # unoptimised, main's from `git archive`, the corpus example copied
      # in -- a statement a named statement may hold by its canonical
      # digest. A change on purpose is an ACCEPTED entry in the tool naming
      # both readings, which a failure prints. The builds go under the
      # runner's temp, not target/: the cache saves target/, and they were
      # 306 MB of it. A frozen corpus main holds, changed or removed, fails
      # it too. Not on a push: main against itself.
      - name: FennecQL reads every text as main reads it
        if: matrix.os == 'ubuntu-latest' && github.event_name != 'push'
        env:
          FENNECQL_CORPUS_TARGET: ${{ runner.temp }}/fennecql-corpus
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          make fennecql-corpus BASE=origin/main

      # The texts each frozen corpus holds (integrations/fennecql-corpus/
      # *.jsonl, each added once and kept), as its tag's own parser read
      # them: a named statement stored as its text under any release since
      # keeps its meaning. This tree's build is the step before's.
      - name: FennecQL reads every text a frozen corpus holds as its tag read it
        if: matrix.os == 'ubuntu-latest'
        env:
          FENNECQL_CORPUS_TARGET: ${{ runner.temp }}/fennecql-corpus
        run: make fennecql-corpus BASE=frozen

      # A node measures its lease on the boot clock (fennec-http's
      # `lease::Moment`), which counts the time a machine was suspended. No
      # runner suspends, so its boot and monotonic clocks read alike and no
      # test tells them apart -- but in a time namespace whose boot clock is a
      # day ahead of its monotonic one, the clock's test fails on any other.
      # The flags are make test's, so the binary is the one it built. The
      # test is named whole and its one pass asked for: renamed, a filter
      # matching nothing runs nothing and passes.
      - name: The lease is measured on the boot clock
        if: matrix.os == 'ubuntu-latest'
        run: |
          bin=$(cargo test --workspace --exclude fennec-bench --lib --bins --tests --no-run \
            --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "fennec_http") | .executable')
          sudo unshare --time --boottime 86400 "$bin" --exact \
            lease::tests::the_boot_clock_is_the_systems_and_runs_as_instant_does \
            | tee /dev/stderr | grep -q 'test result: ok. 1 passed'

      # A test build's clock reaches a tenant whose slot was busy as its
      # shift ended (crates/fennec-http/src/test_clock.rs): set once, such a
      # tenant stood at the shifted time for good. Only `make chaos`'s image
      # builds the feature, so its test runs here, fennec-http's unit tests
      # built again with it, the test named whole and its one pass asked
      # for: renamed, a filter matching nothing runs nothing and passes.
      - name: A test build's clock reaches every open tenant
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo test -p fennec-http --features test-clock --lib -- --exact \
            tenants::tests::a_tenant_busy_as_its_clock_shift_ends_takes_the_systems_clock_back \
            | tee /dev/stderr | grep -q 'test result: ok. 1 passed'

      # fennec studio (`--studio`) in the runner's Chrome against the debug
      # fennec-server `make test` built: signed in with the server's token
      # and as one user of a policy, a scroll through 100 000 rows held to
      # no long task; then the site's playground, the same studio over a
      # database in the page, from the site it builds. About 50 s,
      # puppeteer-core and no browser download.
      - name: fennec studio end to end
        if: matrix.os == 'ubuntu-latest'
        run: CHROME_PATH="$(command -v google-chrome)" make studio-test

      # make test checks it too, but only where the module was built; here
      # it was, and a runner that skipped a scenario fails the job.
      - name: Both sync runners ran every scenario
        run: node integrations/sync-scenarios-check.mjs

      - name: Prune target/ to the crates from outside the workspace (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: sh tools/ci_prune_target.sh

      - name: Save the cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # docs/design/replication.md#follow: the import's PostgreSQL arm and
  # `--follow` -- COPY, pgoutput, the mirror fennec-server serves, SCRAM
  # and TLS against the real server -- are tests marked `#[ignore]`, which
  # need PostgreSQL 17 with pgvector and wal_level=logical: the server
  # `make pgvector-up` starts on a developer's machine, here a service
  # container given the same image, options and port (a service's `command`
  # is the runner's since 2.333.0). It is ready once `pg_isready` answers
  # over TCP, polled a second apart and failed after 120 tries: the image
  # first runs a server of its own on the socket alone, for its setup. TLS
  # is turned on once the checkout holds fennec-wire's test certificates,
  # by `make pgvector-tls`. No cache: a checkout's new file times make
  # cargo build the workspace's crates again whatever target/ holds, what it
  # would keep is fennec-tls's few crates from outside, and the
  # repository's caches are at GitHub's 10 GB already.
  postgres:
    name: postgres (import and --follow)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        # The Makefile's PG_IMAGE: a new one changes both.
        image: pgvector/pgvector:0.8.7-pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
        env:
          POSTGRES_PASSWORD: fennec
          POSTGRES_DB: fennecbench
        ports:
          - 55432:5432
        command: >-
          postgres -c shared_buffers=1GB -c maintenance_work_mem=1GB
          -c max_parallel_workers_per_gather=0 -c wal_level=logical
        options: >-
          --shm-size=2g
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d fennecbench"
          --health-interval 1s --health-timeout 5s --health-retries 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: TLS on in it, fennec-wire's test CA's certificate
        env:
          PG: ${{ job.services.postgres.id }}
        run: make pgvector-tls PG="$PG"

      - name: Install the pinned toolchain
        run: rustup show

      # Built first, so the next step's time is the tests' and the server's.
      - name: Build the tests
        run: |
          cargo test -p fennec-import --test all --no-run
          cargo test -p fennec-server --test all --no-run

      # `make import-test`'s two runs, less its server's start and stop.
      - name: The import's and --follow's tests against PostgreSQL 17
        run: |
          set -o pipefail
          { cargo test -p fennec-import --test all -- --ignored pg:: follow:: &&
            cargo test -p fennec-server --test all -- --ignored follow::; } 2>&1 | tee "$RUNNER_TEMP/import-test.log"

      # A filter that matches nothing, or a test a feature compiles out,
      # passes cargo: the two runs' summaries must count every test the
      # three files mark `#[ignore]` passed, and none ignored.
      - name: Every one of them ran and passed, none ignored
        run: |
          want=$(cat crates/fennec-import/tests/pg.rs crates/fennec-import/tests/follow.rs \
            crates/fennec-server/tests/follow.rs | grep -c '^[[:space:]]*#\[ignore')
          runs=0 passed=0 ignored=0
          while read -r line; do
            [[ $line =~ ([0-9]+)\ passed\;\ ([0-9]+)\ failed\;\ ([0-9]+)\ ignored\; ]] || continue
            runs=$((runs + 1)) passed=$((passed + BASH_REMATCH[1])) ignored=$((ignored + BASH_REMATCH[3]))
          done < <(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/import-test.log" | grep '^test result: ')
          echo "$runs runs: $passed passed and $ignored ignored, of the $want tests marked #[ignore]"
          if [ "$runs" -ne 2 ] || [ "$passed" -ne "$want" ] || [ "$ignored" -ne 0 ]; then exit 1; fi

  # Windows, which no release is built for yet: the programs and the native
  # library build, and `<file>.lock` (`LockFileEx` there) refuses a second
  # holder -- in this process, in another, a second `fennec-server --file`
  # and a shell beside one -- and goes with a holder that closes or is
  # killed. The shell's tests rename a checkpoint, a compact and a restore
  # over a file another handle has open, the server's file mapped since
  # docs/design/windows.md's slice 2. Without the lock a second server took
  # the file beside the first. fennec-core's suite is `windows (core)`'s.
  windows:
    name: windows (single writer)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show

      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: v2-windows-latest-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: v2-windows-latest-cargo-

      - name: Build fennec-server, fennec and the native library
        run: cargo build -p fennec-server -p fennec-cli -p fennec-ffi

      - name: The lock, in this process and another
        run: cargo test -p fennec-abi --lib lock::tests

      # Beside fennec-server's binary, which the build above put there.
      - name: A second process over a served file is refused
        run: cargo test -p fennec-cli --test lock

      - name: Prune target/ to the crates from outside the workspace (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: sh tools/ci_prune_target.sh

      - name: Save the cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # macOS x86_64 ships (release.yml cross-builds fennec and fennec-server
  # for it), and only an x86_64 process runs fennec-core's SSE/AVX and CRC
  # paths there. macos-latest is arm64, so the x86_64 test binaries run under
  # Rosetta 2. The crates the tarball is made of, the shell's and the
  # server's own binaries built for the target too.
  # Only on the merge queue and main: the macOS slots (5 at once) are CI's
  # bottleneck, and a pull request's x86_64 run would wait for one. A job
  # skipped by `if:` reports success, so it can still be a required check.
  macos-x86_64:
    name: test (macos x86_64, Rosetta)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rosetta 2 and the pinned toolchain
        run: |
          softwareupdate --install-rosetta --agree-to-license
          rustup show
          rustup target add x86_64-apple-darwin

      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: v2-macos-x86_64-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: v2-macos-x86_64-cargo-

      # crc.rs falls back to the table silently where detection fails; this
      # makes the test `hardware_path_is_chosen` assert Rosetta runs SSE4.2.
      - name: Test the shipped crates for x86_64-apple-darwin
        env:
          FENNEC_EXPECT_SSE42: '1'
        run: |
          cargo test --target x86_64-apple-darwin \
            -p fennec-core -p fennec-ql -p fennec-abi -p fennec-http \
            -p fennec-cli -p fennec-server

      - name: Prune target/ to the crates from outside the workspace (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: sh tools/ci_prune_target.sh

      - name: Save the cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # fennec-core whole on Windows (docs/design/windows.md, decision 5):
  # the file mapped in views laid end to end in a placeholder (slice 2),
  # every test of the mapped path, and slice 1's experiment on the
  # runner's NTFS and on a ReFS and a FAT32 VHD. Cached apart from the
  # single writer's job, whose target holds the programs.
  windows-core:
    name: windows (core)${{ matrix.os == 'windows-11-arm' && ' arm' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-11-arm: aarch64-windows ships (release.yml).
        os: [windows-latest, windows-11-arm]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show

      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: v2-${{ matrix.os }}-core-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: v2-${{ matrix.os }}-core-

      # The library's and the integration tests; not the examples, which
      # `cargo test` builds otherwise: measurement programs `make` runs on
      # a Unix (`examples/open.rs` reads `getrusage`).
      - name: Build fennec-core's tests
        run: cargo test -p fennec-core --lib --tests --no-run

      # docs/design/windows.md, decision 2's experiment, run on the
      # runner's NTFS and on a ReFS and a FAT32 volume, each a VHD diskpart
      # makes here (the runner's account is an administrator). A volume
      # that could not be made is named, and fails the step: left out, the
      # experiment's assertions would pass without it, saying nothing.
      - name: A ReFS and a FAT32 volume, each a VHD
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $made = @()
          foreach ($v in @(@('refs', 'R', 4096), @('fat32', 'F', 256))) {
            $fs, $letter, $mb = $v
            $vhd = Join-Path $env:RUNNER_TEMP "$fs.vhdx"
            $script = Join-Path $env:RUNNER_TEMP "$fs.diskpart"
            @(
              "create vdisk file=`"$vhd`" maximum=$mb type=expandable",
              "select vdisk file=`"$vhd`"",
              "attach vdisk",
              "create partition primary",
              "format fs=$fs quick label=$fs",
              "assign letter=$letter"
            ) | Set-Content -Path $script -Encoding ascii
            diskpart /s $script
            if (Test-Path "${letter}:\") { $made += "${letter}:\" }
            else { Write-Output "no $fs volume: diskpart could not make one here" }
          }
          "FENNEC_TEST_VOLUMES=$($made -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($made.Count -lt 2) {
            Write-Output "::error::$($made.Count) of 2 volumes made: diskpart failed on this runner image"
            exit 1
          }
          exit 0

      # fennec-core's file layer: a rename made durable (the renamed file
      # and its directory flushed), one another handle refuses tried again
      # for a bounded time and then failing the sink, the experiment --
      # what a read-only view refuses, in this process and another, on each
      # volume -- held to what Windows did, and the mapping (decision 1):
      # the placeholder calls found, a view's last page showing what is
      # written into it after, a thousand handovers' views, each answer
      # printed.
      - name: The file layer, the mapping, and what a view of a file refuses
        run: cargo test -p fennec-core --lib 'fs::' -- --nocapture

      # The rest of fennec-core's suite, the mapped path's files among it --
      # mapped.rs, handover.rs, pinned.rs, prepared.rs, spill.rs, limit.rs,
      # autocompact.rs and windows.rs -- over the runner's NTFS.
      - name: fennec-core's suite
        run: cargo test -p fennec-core --lib --tests -- --skip 'fs::'

      - name: Prune target/ to the crates from outside the workspace (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: sh tools/ci_prune_target.sh

      - name: Save the cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # docs/design/windows.md, slice 3: fennec-server's suite on Windows, each
  # of its servers stopped by Ctrl+Break to the process group the harness
  # started it in -- the one shutdown, through the console's events -- and
  # killed by TerminateProcess, beside fennec-abi's, fennec's and the native
  # library's suites, over files mapped as slice 2 maps them.
  windows-server:
    name: windows (server)${{ matrix.os == 'windows-11-arm' && ' arm' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-11-arm: aarch64-windows ships (release.yml).
        os: [windows-latest, windows-11-arm]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show

      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: v2-${{ matrix.os }}-server-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: v2-${{ matrix.os }}-server-

      - name: Build the suites
        run: cargo test -p fennec-server -p fennec-abi -p fennec-cli -p fennec-ffi --no-run

      # What the design left to Windows itself, printed: whether the harness
      # shares a console with its servers, and whether a second `listen`
      # changes a listener's queue.
      - name: A console shared with the servers, and a second listen
        run: cargo test -p fennec-server --test all 'windows::' -- --nocapture

      - name: fennec-server's suite, its servers stopped by Ctrl+Break
        run: cargo test -p fennec-server

      # The system's randomness, BCryptGenRandom's on Windows: a `--dir`
      # node's and a hooks file's stand-in key, `fennec key`, a sealed
      # archive's nonce.
      - name: fennec-http's randomness and crypto
        run: cargo test -p fennec-http --lib 'crypto::' -- --nocapture

      # After the server's: fennec's lock tests run beside its binary.
      - name: fennec-abi's, fennec's and the native library's suites
        run: cargo test -p fennec-abi -p fennec-cli -p fennec-ffi

      - name: Prune target/ to the crates from outside the workspace (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: sh tools/ci_prune_target.sh

      - name: Save the cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # docs/design/windows.md, slice 4: fennec-http's suite on Windows -- its
  # servers run in the tests' own process, over files mapped as slice 2
  # maps them -- beside fennec-ql's and fennec-import's. With `tls`, as the
  # workspace's run builds it on Linux: HTTPS listeners, dials and their
  # failures' counts. The doc tests and the examples are the Linux job's:
  # platform-free, and minutes here.
  windows-http:
    name: windows (http)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show

      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: v2-windows-latest-http-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: v2-windows-latest-http-

      - name: Build the suites
        run: cargo test -p fennec-http -p fennec-ql -p fennec-import --features fennec-http/tls --lib --tests --no-run

      # What the design left to Windows itself, printed: the module the
      # lease's clock is found in, what a device's name opens in a node's
      # directory, and whom a file the temporary directory gives is open to.
      - name: The lease's clock, devices' names and a secret's DACL
        run: cargo test -p fennec-http --features tls --lib -- --nocapture lease::tests::the_boot_clock owner_only::tests device_s_name

      # fennec-import's sqlite:: tests drive the sqlite3 shell and, before
      # T51, skipped themselves silently on this image, which has none: they
      # ran nowhere on Windows. Under CI a missing sqlite3 now fails them, so
      # the official 3.54.1 tools zip is put on PATH, its SHA3-256 (as
      # sqlite.org/download.html publishes it) checked before it is unpacked.
      - name: A pinned sqlite3 on PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sqlite-dl" "$RUNNER_TEMP/sqlite-tools"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sqlite-dl/tools.zip" https://sqlite.org/2026/sqlite-tools-win-x64-3540100.zip
          python -c "import hashlib,sys; h=hashlib.sha3_256(open(sys.argv[1],'rb').read()).hexdigest(); sys.exit(0 if h==sys.argv[2] else 'sqlite3 zip SHA3-256 mismatch: '+h)" "$RUNNER_TEMP/sqlite-dl/tools.zip" e171f3993a992edf076746926dd52b5e2ebfabaee38818e74987e1d8112ab987
          unzip -q -o "$RUNNER_TEMP/sqlite-dl/tools.zip" -d "$RUNNER_TEMP/sqlite-tools"
          dir=$(dirname "$(find "$RUNNER_TEMP/sqlite-tools" -name sqlite3.exe | head -1)")
          test -n "$dir"
          cygpath -w "$dir" >> "$GITHUB_PATH"

      # Each suite runs whatever the step before found, so one run names
      # every failing test.
      - name: fennec-ql's and fennec-import's suites
        if: ${{ !cancelled() }}
        run: cargo test -p fennec-ql -p fennec-import --lib --tests --no-fail-fast

      - name: fennec-http's suite
        if: ${{ !cancelled() }}
        run: cargo test -p fennec-http --features tls --lib --tests --no-fail-fast

      - name: Prune target/ to the crates from outside the workspace (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: sh tools/ci_prune_target.sh

      - name: Save the cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # docs/design/windows.md, slice 5: the Windows release's zip, made as
  # release.yml makes it on a tag (tools/windows-zip.sh: the release and cli
  # profiles, the C runtime linked in), installed through site/install.ps1
  # and run as the release runs it before keeping it
  # (tools/windows-zip-check.ps1), and the installer's own test against it
  # (site/test_install.ps1), the release served from localhost and read from
  # a folder: nothing is fetched from a published release, and a tag meets
  # no step of the Windows release this job has not run. Cached apart from
  # the other Windows jobs, whose targets hold debug and test builds.
  windows-release:
    name: windows (release zip, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each leg bounded by its own time: the arm runner's installer
          # step takes 25 minutes where x86_64's takes 2.
          - { arch: x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, minutes: 15 }
          - { arch: aarch64, os: windows-11-arm, target: aarch64-pc-windows-msvc, minutes: 55 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # Before the build, so a script that does not read fails in seconds:
      # install.ps1 under Windows PowerShell 5.1, which `irm | iex` runs on
      # a Windows 10, and PowerShell 7; the tests under 7, which runs them.
      # Then what makes running install.ps1 through `iex` safe, held by
      # PowerShell's parser under both (tools/install-ps1-check.ps1): only
      # functions and its one last call at the top level, no expression
      # invoked anywhere in it. site/build.py runs the same check before the
      # site ships the file.
      - name: The PowerShell scripts parse
        shell: pwsh
        run: |
          $parse = '$bad = 0; foreach ($f in $args) { $t = $null; $e = $null; [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path, [ref]$t, [ref]$e); foreach ($x in $e) { Write-Host ($f + '':'' + $x.Extent.StartLineNumber + '': '' + $x.Message); $bad++ } }; Write-Host ($PSVersionTable.PSVersion.ToString() + '': '' + ($args -join '' '') + '', '' + $bad + '' errors''); exit $bad'
          $script = Join-Path $env:RUNNER_TEMP 'parse.ps1'
          Set-Content -LiteralPath $script -Value $parse
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script site/install.ps1
          if ($LASTEXITCODE) { exit 1 }
          pwsh -NoProfile -NonInteractive -File $script site/install.ps1 site/test_install.ps1 tools/windows-zip-check.ps1
          if ($LASTEXITCODE) { exit 1 }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/install-ps1-check.ps1 site/install.ps1
          if ($LASTEXITCODE) { exit 1 }
          pwsh -NoProfile -NonInteractive -File tools/install-ps1-check.ps1 site/install.ps1
          if ($LASTEXITCODE) { exit 1 }

      # The arm64 runner's image holds rustup and the clang ring builds its C
      # with for aarch64-pc-windows-msvc, as the x64 one does.
      - name: Install the pinned toolchain
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: v2-${{ matrix.os }}-release-zip-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: v2-${{ matrix.os }}-release-zip-

      - name: The zip, as release.yml makes it
        run: tools/windows-zip.sh "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" ${{ matrix.target }} dist

      - name: Installed through install.ps1 and run, as release.yml checks it before keeping it
        shell: pwsh
        run: |
          $zip = Get-Item dist/*.zip
          ./tools/windows-zip-check.ps1 -Version ($zip.Name -replace '^fennec-v(.+)-${{ matrix.target }}\.zip$', '$1') -Zip $zip.FullName

      - name: The installer, its checksum, its refusals and the mark of the web
        shell: pwsh
        run: |
          $zip = Get-Item dist/*.zip
          ./site/test_install.ps1 -Zip $zip.FullName -Version ($zip.Name -replace '^fennec-v(.+)-${{ matrix.target }}\.zip$', '$1')

      - name: Prune target/ to the crates from outside the workspace (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: sh tools/ci_prune_target.sh

      - name: Save the cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The C library for Linux as release.yml makes it (tools/linux-ffi.sh) and
  # holds it before it keeps it (tools/linux-ffi-check.sh: its exports, the
  # glibc it asks for, a C program linked to each library through its
  # pkg-config file and run here and in AlmaLinux 9's glibc 2.34), on each
  # architecture's runner and every change, so a tag meets no step of it CI
  # has not run. The tarball is kept as the run's artifact.
  linux-ffi:
    name: linux (C library, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { arch: aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
          command -v pkg-config >/dev/null || { sudo apt-get update && sudo apt-get install -y pkg-config; }

      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: v2-${{ matrix.os }}-linux-ffi-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: v2-${{ matrix.os }}-linux-ffi-

      - name: The tarball, as release.yml makes it
        run: tools/linux-ffi.sh "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" ${{ matrix.target }} dist

      - name: Linked into a C program and run, here and on glibc 2.34, as release.yml checks it before keeping it
        run: tools/linux-ffi-check.sh "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" ${{ matrix.target }} dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fennec-ffi-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Prune target/ to the crates from outside the workspace (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: sh tools/ci_prune_target.sh

      - name: Save the cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # What a pull request does to the browser module against the branch it goes
  # into, on the run's summary page: raw, gzip and brotli, the code by crate,
  # module and part of the standard library, the ten functions that moved
  # most -- and beside it the sizes of the build without the indexes, the
  # test build `make wasm-lite` makes, which no package ships. A pull
  # request is checked out as its merge, so the base is the merge's first
  # parent. It fails nothing -- a size the docs quote is held by
  # site/build.py in the test job.
  size:
    name: size (browser module)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install the pinned toolchain
        run: rustup show

      - name: Measure the module against the base
        env:
          BASE: ${{ github.base_ref }}
        run: |
          sudo apt-get install -y --no-install-recommends brotli
          python3 crates/fennec-wasm/size_report.py HEAD^1 "$BASE"

  # docs/design/benchmarks.md#the-gate: every workload of
  # crates/fennec-http/examples/gate.rs counted under callgrind in the
  # base's build and this one's -- the static musl build that ships, the
  # same program on both sides -- five runs a side, each with its tally of
  # what it asked of the allocator. Counted by the base's copy of the
  # checker, so a pull request's edit of it -- a function priced away, the
  # runs cut -- counts nothing until it has landed; judged apart, by
  # `perf`. The base is the merge's first parent, a pull request's base
  # branch or the commit a merge group queues onto, built with its own
  # toolchain. valgrind and musl-gcc (ring's C, through the examples'
  # dev-dependency on fennec-tls) are the runner's packages, no crate.
  perf-count:
    name: perf (count)
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # Under tools/, so it reads this checkout as its tree; this tree's
      # only where the base has none yet.
      - name: The base's checker
        run: |
          if git show HEAD^1:tools/perf_gate.py > tools/perf_gate_base.py; then
            echo "counted by the base's checker"
          else
            cp tools/perf_gate.py tools/perf_gate_base.py
            echo "the base has no tools/perf_gate.py yet: this tree's counts"
          fi

      # Counted unless every path is the site's, the docs', an
      # integration's, the browser client's, the studio's, deploy/'s or
      # Markdown: the root manifest's profiles, .cargo/ or a tool reach
      # the build as a crate does.
      - name: Whether the change reaches what the gate builds
        id: reach
        run: python3 -I tools/perf_gate_base.py reaches --base HEAD^1 --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

      # The base's channel beside this tree's: a pull request moving
      # rust-toolchain.toml builds its base with the base's compiler.
      - name: Install both sides' toolchains, the musl target, valgrind and musl-gcc
        if: steps.reach.outputs.built == 'true'
        run: |
          rustup show
          rustup target add x86_64-unknown-linux-musl
          base=$(git show HEAD^1:rust-toolchain.toml 2>/dev/null | sed -n 's/^channel *= *"\([^"]*\)".*/\1/p')
          if [ -n "$base" ]; then
            rustup toolchain install "$base" --profile minimal --target x86_64-unknown-linux-musl
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind musl-tools

      - name: Count each workload's instructions and heap in the base's build and this one's
        if: steps.reach.outputs.built == 'true'
        run: |
          python3 -I tools/perf_gate_base.py run --base HEAD^1 --target x86_64-unknown-linux-musl \
            --work "$RUNNER_TEMP/perf" --out "$RUNNER_TEMP/perf/results.json" --no-check

      - name: Keep the results for the judgement
        if: steps.reach.outputs.built == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results
          path: ${{ runner.temp }}/perf/results.json
          retention-days: 14

      # Each side's median run of each workload, by function: what
      # `callgrind_annotate` diffs to name where a count grew.
      - name: Keep the median runs' profiles
        if: steps.reach.outputs.built == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-profiles
          path: ${{ runner.temp }}/perf/profiles/
          retention-days: 14

      # P50, the I/O counts -- fsyncs and bytes written a durable write and
      # a compact, under strace -f -c -- goes here, over the same two
      # builds and the same checker: a results file of its own `metric`.

  # docs/design/benchmarks.md#the-gate: perf (count)'s results held to the
  # base's by the base's copy of the checker, the pull request's
  # PERF_ACCEPTED read as data and the workloads held to the base's own
  # program's: +1% or more in instructions or in heap bytes an op fails
  # unless the pull request adds an entry naming the workload, and so does
  # a workload the base's program runs that this tree dropped or the base
  # did not run. A job of its own: the count runs the change's build
  # scripts and programs, which could put anything on a later step's PATH
  # ($GITHUB_PATH); here nothing of the change runs, and git and python3
  # are the runner's. It names every edit of the gate's own files and
  # every entry added, which the owner approves before the change merges.
  # This job is the check a merge may require.
  perf:
    name: perf (instructions)
    needs: perf-count
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: The base's checker and program
        id: base
        run: |
          mkdir -p "$RUNNER_TEMP/judge"
          if git show HEAD^1:tools/perf_gate.py > tools/perf_gate_base.py; then
            echo "had=true" >> "$GITHUB_OUTPUT"
            echo "judged by the base's checker"
          else
            cp tools/perf_gate.py tools/perf_gate_base.py
            echo "the base has no tools/perf_gate.py yet: this tree's judges"
          fi
          git show HEAD^1:crates/fennec-http/examples/gate.rs > "$RUNNER_TEMP/judge/base_gate.rs" \
            || : > "$RUNNER_TEMP/judge/base_gate.rs"

      - name: The gate's own files this change edits, for the owner
        run: python3 -I tools/perf_gate_base.py edits --base HEAD^1 --summary "$GITHUB_STEP_SUMMARY"

      - name: Whether the change reaches what the gate builds
        id: reach
        run: python3 -I tools/perf_gate_base.py reaches --base HEAD^1 --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

      # A count that failed, or never ran, is no pass.
      - name: The count ran
        if: steps.reach.outputs.built == 'true'
        env:
          COUNT: ${{ needs.perf-count.result }}
        run: |
          if [ "$COUNT" != success ]; then
            echo "::error title=perf gate::perf (count) ended $COUNT: nothing to judge, its log says why"
            echo "perf (count) ended $COUNT: nothing to judge." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: The count's results
        if: steps.reach.outputs.built == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: perf-results
          path: ${{ runner.temp }}/judge

      - name: Hold them to the base's, by the base's checker
        if: steps.reach.outputs.built == 'true'
        env:
          BASE_HAD: ${{ steps.base.outputs.had }}
        run: |
          # The entries the base holds already let nothing through.
          held=()
          if [ "$BASE_HAD" = true ]; then
            held=(--accepted-base tools/perf_gate_base.py)
          fi
          python3 -I tools/perf_gate_base.py check "$RUNNER_TEMP/judge/results.json" \
            --accepted-from tools/perf_gate.py "${held[@]}" \
            --base-program "$RUNNER_TEMP/judge/base_gate.rs" --summary "$GITHUB_STEP_SUMMARY"

  # A page's database kept in real browsers (web/browser/, `make
  # browser-test`): persist and restore against each engine's IndexedDB and
  # WebCrypto, openFile against its origin private file system, the page
  # reloaded in the middle of a persist's transaction and at each step of a
  # file's flush, and a quota passed. web/fennec.persist.test.js and
  # web/fennec.file.test.js hold the same calls to in-memory stand-ins. The
  # module is built once, here, and both browser jobs test those bytes: the
  # macOS job, on the account's scarce Mac runners, builds nothing.
  browsers-module:
    name: browsers (module)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: rustup show

      - name: Build the module
        run: make wasm

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browsers-fennec-wasm
          path: web/fennec.wasm
          if-no-files-found: error
          retention-days: 1

  # Chrome and Firefox headless on Linux, driven by puppeteer-core, each
  # browser's files read before its first launch (run.mjs's `warm`). Chrome
  # stops a busy worker 2 s after its page goes, so its run waits that long
  # at each of the nine reloads in the middle of a flush: 80 s on #650's
  # run, the module's 34 s (2026-11-14).
  browsers:
    name: browsers (chrome, firefox)
    needs: browsers-module
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browsers-fennec-wasm
          path: web

      - name: puppeteer-core
        working-directory: web/browser
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: The suite in Chrome and Firefox
        env:
          CHROME_PATH: /usr/bin/google-chrome
          FIREFOX_PATH: /usr/bin/firefox
        run: node web/browser/run.mjs chrome firefox

  # Safari on macOS through safaridriver, which the runner allows once
  # `--enable`d. On every run, a pull request's too: its own run is where a
  # Safari failure is read, before a merge group is spent on it.
  # It costs one of the 5 macOS slots (CI's bottleneck) for 30 s a run (run
  # 43631233253 on #650, 18 s of it the suite). Bounded by the rule above
  # from that run -- twice 30 s is 1 minute, plus 2 minutes 2.5 -- and 20
  # suite runs in a row on macos-latest took 9 to 25 s each (2026-11-14).
  browsers-safari:
    name: browsers (safari)
    needs: browsers-module
    runs-on: macos-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browsers-fennec-wasm
          path: web

      - name: Allow safaridriver to drive Safari
        run: sudo safaridriver --enable

      - name: The suite in Safari
        run: node web/browser/run.mjs safari

  integrations:
    name: integrations (python, react)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: v2-ubuntu-latest-integrations-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: v2-ubuntu-latest-integrations-

      # LangChain's standard vector store suite and the tests LlamaIndex's
      # own integrations run, from a python:3.13 container, against a
      # fennec-server started on the runner.
      - name: Python stores
        run: make python-test

      # The docs' example for each language -- Python, JavaScript, Go, C#,
      # Java, PHP, Ruby and Rust -- over HTTP against a fennec-server on the
      # runner, each with its language's own HTTP client.
      - name: Languages over HTTP
        run: make languages-test

      # integrations/builder-golden.json is what the JS builder makes of its
      # chains, which the Python, Go and .NET builders are held to below.
      - name: Builder golden file
        run: node web/golden.mjs --check

      # The FennecQL pages' builder tabs: each JavaScript and Python tab run
      # as the page shows it and held to the statement its golden case
      # makes, and the Go, .NET, Swift, Kotlin and Dart tests of the tabs --
      # which those SDKs' jobs run -- what the pages' tabs make.
      - name: Builder tabs on the FennecQL pages
        timeout-minutes: 5
        run: python3 site/builder_tabs.py --check

      # The Go and .NET SDKs against a primary, a replica of it and a node
      # of tenants their tests start, with the runner's Go and .NET; each
      # runs its builder over every case of the golden file.
      - name: Go SDK
        run: make go-test

      - name: .NET SDK
        run: make dotnet-test

      # useLiveQuery against a stand-in and a real fennec-server and replica; the
      # sync layer loads the browser module.
      - name: React hook
        run: make wasm react-test

      # The LangChain.js store over a database in the page and over the
      # HTTP endpoint of a fennec-server started here.
      - name: LangChain.js store
        run: make langchain-test

      # Retrieval for the Vercel AI SDK, against the SDK's own mock models.
      - name: Vercel AI SDK retrieval
        run: make ai-sdk-test

      # The MCP server held to the official TypeScript MCP client over
      # Streamable HTTP and stdio, in both eras, with every configuration
      # the docs give; then the example agent's tools, without its model.
      - name: MCP
        run: make mcp-test

      # web/fennec.d.ts held to web/fennec.js: every export and method the
      # module has declared, and a caller's code type-checked under --strict;
      # then every TypeScript example in the docs against the same types.
      - name: TypeScript declarations
        run: make types-check

      # A database kept in a Durable Object's storage, against a stand-in
      # holding to its limits, and storage that fails part way; then the
      # example Worker under `wrangler dev`, workerd running it, stopped and
      # started again over the same storage.
      - name: Durable Object storage
        run: make cloudflare-test

      # What PyPI, npm and NuGet would take, built as they build it,
      # installed and used. A published release publishes them
      # (packages.yml).
      - name: Packages
        run: |
          integrations/packages.sh
          integrations/dotnet/package.sh

      - name: Prune target/ to the crates from outside the workspace (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: sh tools/ci_prune_target.sh

      - name: Save the cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # examples/: the Notes app in each language that runs on the runner, on
  # this checkout's build -- npm packs of web/ and integrations/react, the
  # Python client by PYTHONPATH, a Go replace, a .NET project reference,
  # Cargo paths -- each its smoke against a fennec-server of its own or the
  # engine in process, the Vite apps built besides. Swift, Kotlin and
  # Flutter run in the mobile jobs, beside their bindings.
  examples:
    name: examples (Node, Python, Go, .NET, Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: v2-ubuntu-latest-examples-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: v2-ubuntu-latest-examples-

      - name: The Notes examples
        run: |
          make wasm
          examples/run-tests.sh node-server web-local react python go dotnet rust

      - name: Prune target/ to the crates from outside the workspace (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: sh tools/ci_prune_target.sh

      - name: Save the cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # examples/shop: the Next.js shop over a release fennec-server -- the
  # catalog seeded, the site built, its lint, its correctness, security and
  # SEO tests, and Lighthouse CI's budgets in the runner's Chrome. A job of
  # its own: a Next build and twelve Lighthouse runs would double the
  # examples job.
  shop:
    name: examples (shop)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: v2-ubuntu-latest-shop-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: v2-ubuntu-latest-shop-

      - name: The shop
        run: |
          make wasm
          cargo build --release -p fennec-server
          SHOP_FENNEC_SERVER="$PWD/target/release/fennec-server" SHOP_LIGHTHOUSE=1 \
            CHROME_PATH="$(command -v google-chrome)" examples/run-tests.sh shop

      - name: Prune target/ to the crates from outside the workspace (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: sh tools/ci_prune_target.sh

      - name: Save the cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # examples/ledger: the payments ledger over a release fennec-server tenant
  # node -- 16 clients making 20 000 operations in process and over HTTP and
  # every invariant after, the security tests, the change-stream sink, a
  # sealed backup restored, and a server killed with SIGKILL under the load. A job of its own, like the
  # shop's: a release server, and about two minutes of load.
  ledger:
    name: examples (ledger)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: v2-ubuntu-latest-ledger-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: v2-ubuntu-latest-ledger-

      - name: The ledger
        run: |
          make wasm
          cargo build --release -p fennec-server -p fennec-cli
          LEDGER_FENNEC_SERVER="$PWD/target/release/fennec-server" LEDGER_FENNEC_CLI="$PWD/target/release/fennec" \
            examples/run-tests.sh ledger

      - name: Prune target/ to the crates from outside the workspace (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: sh tools/ci_prune_target.sh

      - name: Save the cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # examples/saas: Trellis, the team workspace, over release fennec-server
  # tenant nodes and fennec-shard -- its auth and token attack tests, the
  # role matrix against the router, scoped subscriptions and search, a
  # tenant moved and a node killed under load. A job of its own, like the
  # ledger's: release binaries, and a cluster a test file.
  saas:
    name: examples (saas)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: v2-ubuntu-latest-saas-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: v2-ubuntu-latest-saas-

      - name: Trellis
        run: |
          make wasm
          cargo build --release -p fennec-server -p fennec-shard
          SAAS_FENNEC_SERVER="$PWD/target/release/fennec-server" SAAS_FENNEC_SHARD="$PWD/target/release/fennec-shard" \
            examples/run-tests.sh saas

      - name: Prune target/ to the crates from outside the workspace (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: sh tools/ci_prune_target.sh

      - name: Save the cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # examples/recipes: the docs' guides to auth, files in S3 or R2, and functions
  # and webhooks, each run against this checkout's debug fennec-server and
  # web/ -- auth.sh, the files demo against SeaweedFS (pinned) in Docker, which
  # ubuntu-latest has, and the functions demo with the Worker under a pinned
  # wrangler, installed by the script -- and each output held to
  # examples/recipes/golden/ and the golden to the pages that paste it. A job
  # of its own, like the others': Docker and a wrangler no other job uses.
  recipes:
    name: examples (recipes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: v2-ubuntu-latest-recipes-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: v2-ubuntu-latest-recipes-

      - name: The recipes
        run: |
          make wasm
          make recipes-test

      - name: Prune target/ to the crates from outside the workspace (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: sh tools/ci_prune_target.sh

      - name: Save the cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # examples/dispatch: Plover, courier dispatch over release fennec-server
  # tenant nodes and fennec-shard -- 50 couriers claiming at once and waiting
  # at the server, a courier killed under its lease, two companies' quotas
  # side by side, its scoped-token tests, and the Next.js site built and
  # its pages tested. A job of its own, like the saas one's: release
  # binaries, a cluster a test file, and a Next build.
  dispatch:
    name: examples (dispatch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: v2-ubuntu-latest-dispatch-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: v2-ubuntu-latest-dispatch-

      - name: Plover
        run: |
          make wasm
          cargo build --release -p fennec-server -p fennec-shard
          DISPATCH_FENNEC_SERVER="$PWD/target/release/fennec-server" DISPATCH_FENNEC_SHARD="$PWD/target/release/fennec-shard" \
            examples/run-tests.sh dispatch

      - name: Prune target/ to the crates from outside the workspace (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: sh tools/ci_prune_target.sh

      - name: Save the cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # examples/analytics: Kestrel, product analytics over a release
  # fennec-server tenant node -- 40 days of history folded by the rollup
  # worker, its correctness tests against brute force (rollups, funnel,
  # retention, bars, VWAP), its security and SEO tests, its latency budgets
  # and Lighthouse CI's in the runner's Chrome. A job of its own, like the
  # shop's and the ledger's.
  analytics:
    name: examples (analytics)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: v2-ubuntu-latest-analytics-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: v2-ubuntu-latest-analytics-

      - name: Kestrel
        run: |
          make wasm
          cargo build --release -p fennec-server
          ANALYTICS_FENNEC_SERVER="$PWD/target/release/fennec-server" ANALYTICS_LIGHTHOUSE=1 \
            CHROME_PATH="$(command -v google-chrome)" examples/run-tests.sh analytics

      - name: Prune target/ to the crates from outside the workspace (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: sh tools/ci_prune_target.sh

      - name: Save the cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # fennecdb-datasource (integrations/grafana) as a release would ship it --
  # its frontend's types, lint, tests and webpack build, its backend built
  # by mage for linux/amd64 and arm64 -- then monitoring/'s compose as a
  # user starts it: fennec-server's image and Grafana's with the plugin built
  # from this checkout, the seed, every panel of both "fennecdb data"
  # dashboards asked of Grafana (through Infinity and through the plugin)
  # and held to fennec-server's own answer, the plugin's alert rule
  # evaluated, and what the data sources must refuse. Last, the backend's
  # Go tests, against the fennec-server of the image just built.
  grafana:
    name: monitoring (Grafana)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # setup-node's and setup-go's `cache` save in their post step from any
      # ref, and have no read-only switch, so the two caches are the
      # actions' own paths, restored here and saved by main alone below.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/setup-go@v7
        with:
          go-version-file: integrations/grafana/go.mod
          cache: false

      - id: npm-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: v2-npm-${{ runner.os }}-${{ hashFiles('integrations/grafana/package-lock.json') }}
          restore-keys: v2-npm-${{ runner.os }}-

      - id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: v2-go-${{ runner.os }}-${{ hashFiles('integrations/grafana/go.mod', 'integrations/grafana/go.sum') }}
          restore-keys: v2-go-${{ runner.os }}-

      - name: The plugin's frontend
        working-directory: integrations/grafana
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm run test:ci
          npm run build

      - name: The plugin's backend for linux/amd64 and arm64
        working-directory: integrations/grafana
        run: |
          go run github.com/magefile/mage@v1.17.2 -v build:linux build:linuxARM64
          ls -l dist/gpx_fennecdb_linux_amd64 dist/gpx_fennecdb_linux_arm64

      - name: The data dashboards end to end
        run: make grafana-check

      # The image's fennec-server is a static binary: the runner runs it.
      - name: The plugin's backend tests
        working-directory: integrations/grafana
        run: |
          docker create --name fennec-server fennecdb
          docker cp fennec-server:/usr/local/bin/fennec-server "$RUNNER_TEMP/fennec-server"
          FENNEC_SERVER="$RUNNER_TEMP/fennec-server" go test -count=1 ./pkg/...

      - name: Save the npm cache (main only)
        if: github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      - name: Save the Go cache (main only)
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # deploy/: the alert rules under promtool, every systemd unit booted in
  # two privileged containers running systemd, and the failover drill --
  # two regions in Docker, a node and a router killed, nothing acknowledged
  # lost. One build of the binaries (musl, release, deploy/Dockerfile) for
  # both images.
  deploy:
    name: deploy (systemd units, alert rules, failover drill)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: The units and the alert rules
        run: make deploy-check

      - name: The failover drill
        run: make drill

  # The ways to install a release other than the registries: the installer
  # the site serves (site/install.sh) against a release of its own made on
  # localhost, the Homebrew formula the release job writes, and the .deb and
  # .rpm, made by the release's own scripts from the latest release's tarball
  # and installed in a Debian and a Fedora container. Nothing is published.
  packaging:
    name: packaging (installer, Homebrew formula, .deb and .rpm)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: shellcheck --shell=sh site/install.sh site/test_install.sh tools/install-nfpm.sh tools/linux-packages.sh tools/linux-packages-check.sh tools/windows-zip.sh tools/linux-ffi.sh tools/linux-ffi-check.sh

      - name: The installer, its checksum and its refusals
        run: sh site/test_install.sh

      # The formula a maintainer copies into the tap: written by the script
      # (--check, which also needs the repository to be this one), and its four
      # sums the real tarballs' of the release it names (--verify).
      - name: The Homebrew formula
        run: |
          python3 tools/test_homebrew_formula.py
          python3 tools/homebrew-formula.py --check packaging/homebrew/Formula/fennecdb.rb

      # The release before the rename (0.1.12) names its tarballs fenec-v*,
      # so the two steps reading the latest release's tarballs wait for one
      # published as fennec. Remove this step and the two `if`s once one is.
      - name: Whether the latest release is named fennec
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -q '^fennec-v'; then
            echo "fennec=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The latest release predates the fennec name: the formula's sums and its packages are checked once one is published."
          fi

      - name: The Homebrew formula's sums, the latest release's
        if: steps.latest.outputs.fennec == '1'
        run: python3 tools/homebrew-formula.py --verify packaging/homebrew/Formula/fennecdb.rb

      # The latest release's tarball, packed as it is and again named as a
      # pre-release (0.2.0-rc1 is 0.2.0~rc1 in a package), which the first
      # release of a series would otherwise be the first to meet.
      - name: The .deb and .rpm of the latest release's tarball
        if: steps.latest.outputs.fennec == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tools/install-nfpm.sh "$RUNNER_TEMP/nfpm"
          export PATH="$RUNNER_TEMP/nfpm:$PATH"
          gh release download -R "$GITHUB_REPOSITORY" -p 'fennec-v*-x86_64-unknown-linux-musl.tar.gz' -D "$RUNNER_TEMP/tarballs"
          file=$(basename "$RUNNER_TEMP"/tarballs/*.tar.gz)
          version=${file#fennec-v}
          version=${version%%-x86_64*}
          tools/linux-packages.sh "$version" "$RUNNER_TEMP/tarballs" "$RUNNER_TEMP/packages" amd64
          tools/linux-packages-check.sh "$version" "$RUNNER_TEMP/packages" amd64
          pre="$version-rc1"
          mkdir "$RUNNER_TEMP/pre" "$RUNNER_TEMP/pre-tarballs"
          tar -xzf "$RUNNER_TEMP/tarballs/$file" -C "$RUNNER_TEMP/pre"
          mv "$RUNNER_TEMP/pre/fennec-v$version-x86_64-unknown-linux-musl" "$RUNNER_TEMP/pre/fennec-v$pre-x86_64-unknown-linux-musl"
          tar -czf "$RUNNER_TEMP/pre-tarballs/fennec-v$pre-x86_64-unknown-linux-musl.tar.gz" -C "$RUNNER_TEMP/pre" "fennec-v$pre-x86_64-unknown-linux-musl"
          tools/linux-packages.sh "$pre" "$RUNNER_TEMP/pre-tarballs" "$RUNNER_TEMP/pre-packages" amd64
          FENNEC_BINARY_VERSION="$version" tools/linux-packages-check.sh "$pre" "$RUNNER_TEMP/pre-packages" amd64

  build:
    name: build (release + cli profile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show

      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: v2-ubuntu-latest-build-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: v2-ubuntu-latest-build-

      # `make small` is the smallest shell binary and the only build of the
      # CLI without its default features, import and backup. fennec-core
      # without std-fs is the browser build's, in the test and clippy jobs.
      - name: Build the CLI (cli profile, no default features)
        run: make small

      - name: Build the server (release)
        run: cargo build --release -p fennec-server

      - name: Prune target/ to the crates from outside the workspace (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: sh tools/ci_prune_target.sh

      - name: Save the cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # docs/design/conventions.md#fuzzing: every parser of untrusted bytes --
  # an HTTP request, JSON, FennecQL, the codec, a .fennec file's open and a
  # replica's apply, a SQLite file -- fuzzed for 30 s each, built with
  # AddressSanitizer and LLVM's coverage counters on the Makefile's dated
  # nightly (a nightly only here and in fuzz.yml). The test job runs the same
  # targets over their seeds in a plain build; fuzz.yml gives each half an
  # hour a week. It runs on main's pushes too, whose logs and artifacts
  # anyone reads: a finding keeps no input and says no backtrace, only the
  # recipe `fennec-fuzz reproduce` makes its input again from (fuzz.yml).
  fuzz-smoke:
    name: fuzz-smoke (each target 30 s under ASan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the fuzzer's nightly, pinned to a date
        run: make fuzz-toolchain

      - name: Each target for 30 s under AddressSanitizer
        env:
          ASAN_OPTIONS: log_path=${{ runner.temp }}/asan
        run: make fuzz-smoke FUZZ_SECONDS=30 FUZZ_FLAGS="--private --corpus none"

      - name: Say how to make what it found again
        if: failure()
        run: |
          echo "fennec-fuzz found something at $GITHUB_SHA. Its input is kept nowhere: check out"
          echo "$GITHUB_SHA, run 'make fuzz-seeds' and 'make fuzz ASAN=1', then the line"
          echo "'fennec-fuzz reproduce ...' above with target/<host>/fuzz/fennec-fuzz"
          echo "(docs/design/conventions.md#fuzzing)."

  # The native library an app links (crates/fennec-ffi) on Android and the
  # JVM, and its Kotlin, Dart and Flutter bindings: the Kotlin library's
  # JVM tests against the Linux build, the AAR with the library built by
  # the NDK for each ABI, the Dart package's tests, the Flutter plugin's,
  # and the plugin's example built as an Android app. The runner has the
  # Android SDK and NDK.
  mobile-android:
    name: mobile (Android, JVM, Dart, Flutter)
    runs-on: ubuntu-latest
    # About 10 minutes warm: a hang fails within the hour rather than at
    # the runner's six.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain and the Android targets
        run: |
          rustup show
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: v2-ubuntu-latest-mobile-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: v2-ubuntu-latest-mobile-

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      # Gradle 8.10.2 for the Kotlin builds through a wrapper: its
      # distribution is then kept in the Gradle User Home's cache entry, as
      # the Flutter app's 9.5.0 is, and comes back with it. setup-gradle's
      # own `gradle-version` kept 8.10.2 under a key of its own and asked
      # services.gradle.org for its list of versions every run: the 6 of 50
      # runs on 2026-11-14 that restored main's Gradle User Home each
      # downloaded 8.10.2 again (docs/design/conventions.md#reruns). The
      # runner's Gradle writes the wrapper offline, and the wrapper holds
      # the download to Gradle's published sum.
      - name: Gradle 8.10.2 through a wrapper
        run: |
          set -eu
          touch "$RUNNER_TEMP/gradle-home-restored"
          w="$RUNNER_TEMP/gradle-8.10.2"
          mkdir -p "$w/bin"
          cd "$w"
          : > settings.gradle
          gradle --no-daemon -q wrapper --gradle-version 8.10.2 --no-validate-url \
            --gradle-distribution-sha256-sum 31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26
          ln -s "$w/gradlew" "$w/bin/gradle"
          echo "$w/bin" >> "$GITHUB_PATH"

      # Linux with Gradle: run-tests.sh builds the library and the server
      # the sync tests start here and runs JUnit on the runner, no
      # container.
      - name: Kotlin (JVM tests)
        timeout-minutes: 20
        run: make kotlin-test

      - name: Android AAR
        run: |
          set -eu
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          integrations/kotlin/build-aar.sh dist-mobile

      # The Notes example over a Gradle composite build of integrations/kotlin
      # (FENNEC_LOCAL): the JVM CLI's smoke against the library built above,
      # then the Compose app built as an APK.
      - name: Notes (Kotlin, Compose)
        timeout-minutes: 20
        run: examples/kotlin-android/run-smoke.sh

      - name: The library's size on Android and Linux
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          integrations/ffi-sizes.sh x86_64-unknown-linux-gnu aarch64-linux-android armv7-linux-androideabi x86_64-linux-android \
            | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/ffi-sizes.md"
          # The docs quote these; a size 1% off integrations/ffi-sizes.md fails.
          python3 integrations/ffi_sizes_check.py "$RUNNER_TEMP/ffi-sizes.md"

      # Flutter is pinned here, in the plugin's job and in packages.yml: `stable`
      # alone floats, and 3.50.0 (2026-11-11) deprecated
      # package:flutter/material.dart, which `flutter analyze` fails on in the
      # examples (#590). Raised by hand, once the examples take what a new
      # release asks: 3.50.0 after they moved to package:material_ui (#591).
      # No cache: the action's own saves from any ref and has no read-only
      # switch, the SDK's entry was 2.0 GiB (macOS) and 1.6 GiB (Linux) and
      # restoring it saved 28 s and 16 s of a download (docs/design/conventions.md).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: false
          pub-cache: false

      # The Dart package under Flutter's own Dart -- its sync tests against
      # a server run-tests.sh builds -- then the plugin's test.
      - name: Dart and the Flutter plugin
        timeout-minutes: 20
        run: make dart-test

      - name: The Flutter plugin in an Android app
        run: |
          set -eu
          integrations/dart/fennecdb_flutter/prepare.sh --platforms android
          cd integrations/dart/fennecdb_flutter/example
          flutter create --platforms=android --project-name fennecdb_flutter_example .
          rm -rf test
          flutter build apk --debug
          unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep libfennec_ffi.so

      # The Notes example: its logic's smoke under flutter test, then the
      # app built as an APK, on this checkout's packages (pub overrides).
      - name: Notes (Flutter)
        timeout-minutes: 20
        run: examples/flutter/run-tests.sh apk

      # Nothing in a workflow downloads this (packages.yml rebuilds the AAR
      # from a release): it is for a person to fetch. An upload that fails
      # on GitHub's side (#590/#591 lost a merge-queue run to one) must not
      # fail a job whose tests all passed. A test is never retried.
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: fennecdb-android
          path: dist-mobile/*.aar
          if-no-files-found: error

      # The log names each failing test with its assertion and stack (the
      # Kotlin build's testLogging, dart test's GitHub reporter); the JUnit
      # reports add each test's output. Gradle's HTML report was all a run
      # left of "1 failed" when it was not uploaded.
      - name: Test reports of a failing run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-android
          path: |
            integrations/kotlin/fennecdb/build/reports/tests/
            integrations/kotlin/fennecdb/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

      # What the Gradle builds fetched rather than found in the restored
      # Gradle User Home: what was written into it after the restore -- a
      # distribution's marker once its wrapper unpacked it (the zip is
      # deleted then), a plugin's marker, any artifact. A run that restored
      # main's entry names nothing here.
      - name: What Gradle fetched
        if: ${{ !cancelled() }}
        run: |
          m="$RUNNER_TEMP/gradle-home-restored"
          test -f "$m" || exit 0
          find "$GRADLE_USER_HOME/wrapper/dists" -name '*.zip.ok' -newer "$m" 2>/dev/null | sed 's|.*/\(.*\)\.zip\.ok$|Gradle distribution installed: \1|'
          find "$GRADLE_USER_HOME/caches/modules-2/files-2.1" -name '*.gradle.plugin-*.pom' -newer "$m" 2>/dev/null | sed 's|.*/|Plugin downloaded: |'
          echo "Artifacts downloaded: $(find "$GRADLE_USER_HOME/caches/modules-2/files-2.1" -type f -newer "$m" 2>/dev/null | wc -l)"

      - name: Prune target/ to the crates from outside the workspace (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: sh tools/ci_prune_target.sh

      - name: Save the cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The same on Apple's platforms: every slice of the XCFramework, the Swift
  # package's tests on macOS and on an iOS simulator, and the library's size
  # linked for each target. The runner has Xcode. The Flutter plugin's
  # example is built from what this job and the Android one made, packed,
  # in the job after both (flutter-plugin).
  mobile-apple:
    name: mobile (Swift, iOS, XCFramework)
    runs-on: macos-latest
    # About 13 minutes warm. A hung `swift test` held this runner for six
    # hours; the steps that run tests are bounded on their own as well.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain and the Apple targets
        run: |
          rustup show
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios x86_64-apple-darwin

      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: v2-macos-latest-mobile-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: v2-macos-latest-mobile-

      - name: XCFramework (macOS, iOS, the simulator)
        run: integrations/swift/build-xcframework.sh --zip

      # FennecFFI.framework a slice, and the macOS one's binary as a plain
      # libfennec_ffi.dylib beside it: what the Flutter plugin's pods vendor
      # and CocoaPods embeds.
      - name: Dynamic XCFramework and macOS's dylib (the Flutter plugin's)
        run: integrations/swift/build-xcframework.sh --dynamic --zip

      # Package.swift takes the XCFramework just built; the sync tests
      # start a fennec-server, kill it and start it again, and the
      # read-routing tests put fennec-shard routers in front of two.
      - name: Swift (macOS)
        timeout-minutes: 20
        run: |
          cargo build -p fennec-server -p fennec-shard
          swift test

      # The same tests with Swift's cooperative pool cut to one thread: a
      # call that blocks a thread of it hangs there at once, where on this
      # three-core runner it hung now and then -- the run that held it for
      # six hours. The script samples every thread of a run that hangs.
      - name: Swift (macOS, one cooperative thread)
        timeout-minutes: 10
        run: integrations/swift/test-strict.sh

      - name: Swift (iOS simulator)
        timeout-minutes: 20
        run: integrations/swift/test-ios.sh

      # The Notes example on the package at the root (FENNEC_LOCAL): the
      # SwiftUI app and the CLI built, the CLI's smoke run, and the views'
      # library built for the iOS simulator.
      - name: Notes (Swift)
        timeout-minutes: 20
        working-directory: examples/swift
        env:
          FENNEC_LOCAL: '1'
        run: |
          swift build
          swift run notes-cli smoke
          xcodebuild -scheme NotesKit -destination 'generic/platform=iOS Simulator' build -quiet

      - name: The library's size on Apple's platforms
        run: |
          integrations/ffi-sizes.sh aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin \
            | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/ffi-sizes.md"
          python3 integrations/ffi_sizes_check.py "$RUNNER_TEMP/ffi-sizes.md"

      # Nothing downloads this either (see the Android upload): a failed
      # upload on GitHub's side does not fail a job whose tests passed.
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: fennecdb-xcframework
          path: |
            integrations/swift/build/FennecFFI.xcframework.zip
            integrations/swift/build/FennecFFI.xcframework.zip.checksum
            integrations/swift/build/FennecFFIDynamic.xcframework.zip
          if-no-files-found: error

      # `swift test` names a failing test and its issue in the log; the
      # simulator's run keeps its result bundle (test-ios.sh), which holds
      # each test's output and the crash logs.
      - name: Test results of a failing run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-apple
          path: integrations/swift/build/ios-tests.xcresult
          retention-days: 7
          if-no-files-found: ignore

      - name: Prune target/ to the crates from outside the workspace (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: sh tools/ci_prune_target.sh

      - name: Save the cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The Flutter plugin as pub.dev gets it (docs/design/integrations.md#flutter-plugin):
  # packed from what the two jobs above made as packages.yml packs it from a
  # release -- the dynamic XCFramework with macOS's dylib beside it, and the
  # AAR's .so for each ABI, through prepare.sh, out of the repository, by
  # pub's own packing -- and held to its sizes and to each platform's
  # library once (tools/flutter_archive_check.py): pub keeps no symbolic
  # link, and 0.2.0's archive carried the macOS binary six times. Then the
  # example in that archive, on the plugin beside it, is built for macOS,
  # where its integration test opens a file through the library the app
  # embeds, and for the iOS simulator.
  flutter-plugin:
    name: mobile (the Flutter plugin as pub.dev gets it)
    needs: [mobile-android, mobile-apple]
    runs-on: macos-latest
    permissions:
      contents: read
    # Two builds of the example for macOS, one for the simulator: a hang
    # fails within the job's bound rather than at the runner's six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fennecdb-xcframework
          path: assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fennecdb-android
          path: assets

      # Flutter 3.50.0, as the Android job pins it, and as there with no
      # cache: the action's own saves from any ref (see the Android job).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: false
          pub-cache: false

      # packages.yml's "The native libraries, from the release" and its
      # Publish's copy, the archive written where a publish would upload it
      # (`--to-archive`; `--skip-validation`, as nothing is published, leaves
      # the version of `fennecdb` it names unresolved).
      - name: The plugin packed as packages.yml packs it, held to its sizes
        run: |
          set -euo pipefail
          mkdir -p integrations/swift/build integrations/kotlin/android/build/jniLibs
          unzip -q assets/FennecFFIDynamic.xcframework.zip -d integrations/swift/build/dynamic
          unzip -q assets/fennecdb-android-*.aar 'jni/*' -d assets/aar
          cp -R assets/aar/jni/. integrations/kotlin/android/build/jniLibs/
          integrations/dart/fennecdb_flutter/prepare.sh
          out="$RUNNER_TEMP/fennecdb_flutter"
          cp -R integrations/dart/fennecdb_flutter "$out"
          rm -f "$out/pubspec_overrides.yaml"
          cp LICENSE "$out/"
          (cd "$out" && flutter pub publish --skip-validation --to-archive="$RUNNER_TEMP/fennecdb_flutter.tar.gz")
          python3 tools/flutter_archive_check.py "$RUNNER_TEMP/fennecdb_flutter.tar.gz" | tee -a "$GITHUB_STEP_SUMMARY"

      # The archive unpacked: its example's `path: ../` is the plugin as
      # packed, and `fennecdb` is this commit's (pubspec_overrides.yaml, in
      # place of the example's own overrides). The release build is the app
      # as it ships, both architectures, the dylib CocoaPods embedded; the
      # integration test builds it again for this machine and runs it.
      - name: The example on macOS, from the archive
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP/fennecdb_flutter.tar.gz" -C "$RUNNER_TEMP/unpacked"
          cd "$RUNNER_TEMP/unpacked/example"
          printf 'dependency_overrides:\n  fennecdb:\n    path: %s\n' "$GITHUB_WORKSPACE/integrations/dart/fennecdb" > pubspec_overrides.yaml
          flutter create --platforms=macos,ios --project-name fennecdb_flutter_example .
          rm -rf test
          flutter build macos
          lipo build/macos/Build/Products/Release/fennecdb_flutter_example.app/Contents/Frameworks/libfennec_ffi.dylib \
            -verify_arch arm64 x86_64
          flutter test integration_test -d macos

      - name: The example on the iOS simulator, from the archive
        timeout-minutes: 15
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/unpacked/example"
          flutter build ios --simulator --debug --no-codesign
          test -f build/ios/iphonesimulator/Runner.app/Frameworks/FennecFFI.framework/FennecFFI
