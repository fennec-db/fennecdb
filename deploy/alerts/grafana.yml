# deploy/alerts/fennecdb.rules.yml as Grafana-managed alert rules, over the
# Prometheus data source Grafana reads fennecdb's metrics through (uid
# `prometheus`, as monitoring/grafana/provisioning/datasources/prometheus.yml
# provisions it). Copy it into Grafana's provisioning/alerting/ beside
# monitoring/'s own rule. Evaluated every 30 s, the shortest `for` among
# them: a rule's `for` is counted in evaluations, so at a minute's interval
# a `for: 30s` waited a minute.
#
# Each rule is the Prometheus rule's expression, which returns the series
# that are alerting and nothing else, and a condition that fires for every
# series it returns (is_number), whatever its value -- 0 for an archiver
# count below 1. No series is no alert (noDataState: OK).
#
# crates/fennec-shard/tests/datadog.rs holds every rule here to its
# Prometheus twin, title to alert and expression to expression.
apiVersion: 1
groups:
  - orgId: 1
    name: fennecdb-deployment
    folder: fennecdb
    interval: 30s
    rules:
      - uid: fennec-node-down
        title: FennecNodeDown
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: up{job="fennecdb-node"} == 0
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.instance }} does not answer: its router fails its tenants over as its lease lapses, and its replicas are gone"
          runbook: deploy/RUNBOOK.md#a-node-lost
      - uid: fennec-primary-router-down
        title: FennecPrimaryRouterDown
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: up{job=~"fennecdb-router|fennecdb-global"} == 0 and on (instance) last_over_time(fennec_router_following[1h]) == 0
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Router {{ $labels.instance }} keeps its directory and does not answer: promote its standby"
          runbook: deploy/RUNBOOK.md#a-router-lost
      - uid: fennec-standby-router-down
        title: FennecStandbyRouterDown
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: up{job=~"fennecdb-router|fennecdb-global"} == 0 and on (instance) last_over_time(fennec_router_following[1h]) == 1
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Standby router {{ $labels.instance }} does not answer: its directory has no standby to promote"
          runbook: deploy/RUNBOOK.md#a-router-lost
      - uid: fennec-router-down
        title: FennecRouterDown
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: up{job=~"fennecdb-router|fennecdb-global"} == 0 unless on (instance) last_over_time(fennec_router_following[1h])
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Router {{ $labels.instance }} does not answer, and has not in the hour"
          runbook: deploy/RUNBOOK.md#a-router-lost
      - uid: fennec-scrape-missing
        title: FennecScrapeMissing
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: absent(up{job="fennecdb-node"}) or absent(up{job="fennecdb-router"}) or absent(up{job="fennecdb-global"}) or absent(up{job="node-exporter"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus scrapes no target of job {{ $labels.job }}: every alert over it is blind"
          runbook: deploy/RUNBOOK.md#alerts
      - uid: fennec-connections-near-ceiling
        title: FennecConnectionsNearCeiling
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: fennec_connections > 3200 or fennec_router_connections > 800
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} holds {{ $values.A.Value }} connections, near its --max-connections"
          runbook: deploy/RUNBOOK.md#adding-a-node
      - uid: fennec-no-thread-for-connection
        title: FennecNoThreadForConnection
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum by (instance) (increase(fennec_connections_refused_total{reason="no_thread"}[5m])) > 0 or sum by (instance) (increase(fennec_router_connections_refused_total{reason="no_thread"}[5m])) > 0
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} could make no thread for a connection and refused it 503: it is at its thread limit"
          runbook: deploy/RUNBOOK.md#installing-a-machine
      - uid: fennec-node-failed-over
        title: FennecNodeFailedOver
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: fennec_router_node_failed_over == 1
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.node }} ({{ $labels.region }}) was failed over and has not answered since"
          runbook: deploy/RUNBOOK.md#a-node-lost
      - uid: fennec-auto-failover-incomplete
        title: FennecAutoFailoverIncomplete
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: fennec_router_tenants > 0 and on (instance, node) fennec_router_node_failed_over == 1
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.node }} ({{ $labels.region }}) was failed over with tenants still placed on it ({{ $values.A.Value }}): they take no writes"
          runbook: deploy/RUNBOOK.md#a-node-lost
      - uid: fennec-auto-failover
        title: FennecAutoFailover
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: increase(fennec_router_auto_failovers_total{outcome="done"}[10m]) > 0
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} failed a node over in the last 10 minutes"
          runbook: deploy/RUNBOOK.md#a-node-lost
      - uid: fennec-lease-renewal-late
        title: FennecLeaseRenewalLate
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: max_over_time(fennec_router_lease_age_seconds[5m]) > 3 unless on (instance, node) max_over_time(fennec_router_node_failed_over[10m]) == 1
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.node }} went {{ $values.A.Value }} s without a lease in the last five minutes"
          runbook: deploy/RUNBOOK.md#a-lease-late
      - uid: fennec-tenants-without-replica
        title: FennecTenantsWithoutReplica
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: fennec_router_tenants_unreplicated > 0 and on (instance) fennec_router_following == 0
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $values.A.Value }} tenants on {{ $labels.instance }}{{ if $labels.region }} in {{ $labels.region }}{{ end }} have no copy to fail over to"
          runbook: deploy/RUNBOOK.md#tenants-without-a-replica
      - uid: fennec-files-left-on-nodes
        title: FennecFilesLeftOnNodes
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: fennec_router_files_left > 0 and on (instance) fennec_router_following == 0
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $values.A.Value }} files {{ $labels.instance }} may have left on nodes are placed by nothing"
          runbook: deploy/RUNBOOK.md#files-left-on-nodes
      - uid: fennec-same-zone-copies
        title: FennecSameZoneCopies
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: fennec_router_same_zone_copies > 0 and on (instance) fennec_router_following == 0
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $values.A.Value }} tenants of {{ $labels.region }} keep their copy in their own zone"
          runbook: deploy/RUNBOOK.md#adding-a-node
      - uid: fennec-read-replicas-given-up
        title: FennecReadReplicasGivenUp
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: fennec_router_read_replicas_given_up > 0
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $values.A.Value }} read replicas on {{ $labels.instance }} were lost three times and are made again no more"
          runbook: deploy/RUNBOOK.md#read-replicas
      - uid: fennec-tenants-moving
        title: FennecTenantsMoving
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: fennec_router_tenants_moving > 0 and on (instance) fennec_router_following == 0
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "A move on {{ $labels.instance }} has not recorded done in 15 minutes"
          runbook: deploy/RUNBOOK.md#placing-and-moving-a-tenant
      - uid: fennec-node-unreachable
        title: FennecNodeUnreachable
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum by (instance, node) (rate(fennec_router_upstream_errors_total[5m])) > 0
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} cannot reach node {{ $labels.node }}: its requests are answered 502"
          runbook: deploy/RUNBOOK.md#a-node-lost
      - uid: fennec-router5xx
        title: FennecRouter5xx
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum by (instance) (rate(fennec_router_requests_total{route=~"tenant|call",code="5xx"}[5m])) / sum by (instance) (rate(fennec_router_requests_total{route=~"tenant|call"}[5m])) > 0.01
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} answers more than 1% of tenants' requests 5xx"
          runbook: deploy/RUNBOOK.md#errors-and-refusals
      - uid: fennec-entry-mark-refused
        title: FennecEntryMarkRefused
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum by (instance, outcome) (rate(fennec_router_entry_clients_total{outcome=~"bad_mark|stale"}[5m])) > 0
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} does not believe the entry's client marks ({{ $labels.outcome }})"
          runbook: deploy/RUNBOOK.md#the-entry-token
      - uid: fennec-entry-mark-absent
        title: FennecEntryMarkAbsent
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum by (instance) (rate(fennec_router_entry_clients_total{outcome="absent"}[5m])) > 0
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.instance }} takes tenants' requests that name no client: the entry's ENTRY_TOKEN unset, or a client past the entry"
          runbook: deploy/RUNBOOK.md#the-entry-token
      - uid: fennec-router-refusals
        title: FennecRouterRefusals
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum by (instance) (rate(fennec_router_refused_total[5m])) > 1
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} refuses more than one token a second (401)"
          runbook: deploy/RUNBOOK.md#errors-and-refusals
      - uid: fennec-replica-disconnected
        title: FennecReplicaDisconnected
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: fennec_replica_connected == 0
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} lost its primary: a standby router that cannot be promoted up to date"
          runbook: deploy/RUNBOOK.md#a-router-lost
      - uid: fennec-replica-behind
        title: FennecReplicaBehind
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: fennec_replica_behind > 1000
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} is {{ $values.A.Value }} writes behind its primary"
          runbook: deploy/RUNBOOK.md#a-router-lost
      - uid: fennec-replica-silent
        title: FennecReplicaSilent
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: fennec_replica_last_contact_seconds > 60
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} has not heard from its primary in {{ $values.A.Value }} s"
          runbook: deploy/RUNBOOK.md#a-router-lost
      - uid: fennec-directory-unreplicated
        title: FennecDirectoryUnreplicated
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: fennec_replicas{job="fennecdb-router"} == 0 and on (instance) fennec_router_following{job="fennecdb-router"} == 0
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} keeps a directory no standby follows"
          runbook: deploy/RUNBOOK.md#a-router-lost
      - uid: fennec-quota-refusals
        title: FennecQuotaRefusals
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum by (instance, quota) (increase(fennec_quota_refused_total[15m])) > 0
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: info
        annotations:
          summary: "A tenant of {{ $labels.instance }} was refused for its quota of {{ $labels.quota }}"
          runbook: deploy/RUNBOOK.md#quotas
      - uid: fennec-node-refusals
        title: FennecNodeRefusals
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum by (instance) (rate(fennec_refused_total[5m])) > 1
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} refuses more than one token a second (401)"
          runbook: deploy/RUNBOOK.md#errors-and-refusals
      - uid: fennec-statement-errors
        title: FennecStatementErrors
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum by (instance) (rate(fennec_statement_errors_total[5m])) / sum by (instance) (rate(fennec_statements_total[5m])) > 0.05
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of {{ $labels.instance }}'s statements end in an error"
          runbook: deploy/RUNBOOK.md#errors-and-refusals
      - uid: fennec-storage-failed
        title: FennecStorageFailed
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: fennec_storage_failed == 1
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: is_number($A)
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }}'s disk refused a write: it takes none until restarted"
          runbook: deploy/RUNBOOK.md#errors-and-refusals
      - uid: fennec-archive-sync-stale
        title: FennecArchiveSyncStale
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
