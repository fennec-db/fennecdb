# promtool's tests of fennecdb.rules.yml: the rules whose expression could
# be quietly wrong, each over series shaped as the binaries export them.
# `make deploy-check` runs them (promtool test rules, in Docker).
rule_files:
  - fennecdb.rules.yml

evaluation_interval: 15s

tests:
  # A node failed over: on the router that keeps its directory.
  - interval: 15s
    input_series:
      - series: 'fennec_router_node_failed_over{instance="r1:8090",node="eu-a",region="eu"}'
        values: '0 0 1 1 1'
      - series: 'fennec_router_node_failed_over{instance="r1:8090",node="eu-b",region="eu"}'
        values: '0 0 0 0 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: FennecNodeFailedOver
        exp_alerts:
          - exp_labels: {severity: critical, instance: "r1:8090", node: eu-a, region: eu}
            exp_annotations:
              summary: "Node eu-a (eu) was failed over and has not answered since"
              runbook: deploy/RUNBOOK.md#a-node-lost

  # A region of two nodes after one was lost: every tenant on the other,
  # none with a copy, counted by region -- and the standby router's count
  # of the same directory alerting nothing, nor a region with every tenant
  # replicated, its count 0. A directory naming no region sends the count
  # unlabelled, and the summary names none.
  - interval: 1m
    input_series:
      - series: 'fennec_router_tenants_unreplicated{instance="r1:8090",region="eu"}'
        values: '6x20'
      - series: 'fennec_router_tenants_unreplicated{instance="r1:8090",region="us"}'
        values: '0x20'
      - series: 'fennec_router_following{instance="r1:8090"}'
        values: '0x20'
      - series: 'fennec_router_tenants_unreplicated{instance="r2:8090",region="eu"}'
        values: '6x20'
      - series: 'fennec_router_following{instance="r2:8090"}'
        values: '1x20'
      - series: 'fennec_router_tenants_unreplicated{instance="r3:8090"}'
        values: '3x20'
      - series: 'fennec_router_following{instance="r3:8090"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: FennecTenantsWithoutReplica
        exp_alerts:
          - exp_labels: {severity: warning, instance: "r1:8090", region: eu}
            exp_annotations:
              summary: "6 tenants on r1:8090 in eu have no copy to fail over to"
              runbook: deploy/RUNBOOK.md#tenants-without-a-replica
          - exp_labels: {severity: warning, instance: "r3:8090"}
            exp_annotations:
              summary: "3 tenants on r3:8090 have no copy to fail over to"
              runbook: deploy/RUNBOOK.md#tenants-without-a-replica

  # A count that held 16 minutes fires, and clears as the count does: the
  # router's own try gave the replica, or an operator's repair did.
  - interval: 1m
    input_series:
      - series: 'fennec_router_tenants_unreplicated{instance="r1:8090",region="eu"}'
        values: '1x16 0x10'
      - series: 'fennec_router_following{instance="r1:8090"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 16m
        alertname: FennecTenantsWithoutReplica
        exp_alerts:
          - exp_labels: {severity: warning, instance: "r1:8090", region: eu}
            exp_annotations:
              summary: "1 tenants on r1:8090 in eu have no copy to fail over to"
              runbook: deploy/RUNBOOK.md#tenants-without-a-replica
      - eval_time: 20m
        alertname: FennecTenantsWithoutReplica
        exp_alerts: []

  # A replica that did not take, given one by the router's own try after
  # two minutes: never 15 minutes without, so nothing. Nor a count that
  # comes and goes, each stretch shorter than the rule's `for`.
  - interval: 1m
    input_series:
      - series: 'fennec_router_tenants_unreplicated{instance="r1:8090",region="eu"}'
        values: '0 1 1 0x10 1x10 0x5'
      - series: 'fennec_router_following{instance="r1:8090"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 16m
        alertname: FennecTenantsWithoutReplica
        exp_alerts: []
      - eval_time: 25m
        alertname: FennecTenantsWithoutReplica
        exp_alerts: []

  # Files left on nodes, counted by the leading router and its standby
  # alike: the leading one's count alerts once it has held half an hour,
  # and clears as an operator removes them and a repair's look forgets
  # them; a count that a repair's try forgot within minutes never alerts.
  - interval: 1m
    input_series:
      - series: 'fennec_router_files_left{instance="r1:8090"}'
        values: '2x40 0x10'
      - series: 'fennec_router_following{instance="r1:8090"}'
        values: '0x50'
      - series: 'fennec_router_files_left{instance="r2:8090"}'
        values: '2x40 0x10'
      - series: 'fennec_router_following{instance="r2:8090"}'
        values: '1x50'
      - series: 'fennec_router_files_left{instance="r3:8090"}'
        values: '0 1 1 0x47'
      - series: 'fennec_router_following{instance="r3:8090"}'
        values: '0x50'
    alert_rule_test:
      - eval_time: 31m
        alertname: FennecFilesLeftOnNodes
        exp_alerts:
          - exp_labels: {severity: warning, instance: "r1:8090"}
            exp_annotations:
              summary: "2 files r1:8090 may have left on nodes are placed by nothing"
              runbook: deploy/RUNBOOK.md#files-left-on-nodes
      - eval_time: 45m
        alertname: FennecFilesLeftOnNodes
        exp_alerts: []

  # No archiver connected: a count of 0, which still alerts.
  - interval: 1m
    input_series:
      - series: 'fennec_node_streams{instance="n1:8081"}'
        values: '1 1 0x15'
    alert_rule_test:
      - eval_time: 14m
        alertname: FennecArchiverDisconnected
        exp_alerts:
          - exp_labels: {severity: warning, instance: "n1:8081"}
            exp_annotations:
              summary: "No archiver follows n1:8081: its writes reach no archive"
              runbook: deploy/RUNBOOK.md#archives-and-restores

  # The entry's marks refused, by outcome; named ones alert nothing.
  - interval: 1m
    input_series:
      - series: 'fennec_router_entry_clients_total{instance="r1:8090",outcome="named"}'
        values: '0+600x20'
      - series: 'fennec_router_entry_clients_total{instance="r1:8090",outcome="bad_mark"}'
        values: '0+60x20'
      - series: 'fennec_router_entry_clients_total{instance="r1:8090",outcome="stale"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: FennecEntryMarkRefused
        exp_alerts:
          - exp_labels: {severity: warning, instance: "r1:8090", outcome: bad_mark}
            exp_annotations:
              summary: "r1:8090 does not believe the entry's client marks (bad_mark)"
              runbook: deploy/RUNBOOK.md#the-entry-token

  # 5xx past 1% of the tenants' requests.
  - interval: 1m
    input_series:
      - series: 'fennec_router_requests_total{instance="r1:8090",route="tenant",code="2xx"}'
        values: '0+1000x20'
      - series: 'fennec_router_requests_total{instance="r1:8090",route="tenant",code="5xx"}'
        values: '0+50x20'
      - series: 'fennec_router_requests_total{instance="r1:8090",route="shard",code="5xx"}'
        values: '0+5000x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: FennecRouter5xx
        exp_alerts:
          - exp_labels: {severity: warning, instance: "r1:8090"}
            exp_annotations:
              summary: "r1:8090 answers more than 1% of tenants' requests 5xx"
              runbook: deploy/RUNBOOK.md#errors-and-refusals

  # A directory no standby follows: a region's primary router's, not a
  # standby's -- and never the global router's, whose count the regions'
  # routers keep up (FennecStandbyRouterDown is its rule).
  - interval: 1m
    input_series:
      - series: 'fennec_replicas{job="fennecdb-router",instance="r1:8090"}'
        values: '1 0x15'
      - series: 'fennec_router_following{job="fennecdb-router",instance="r1:8090"}'
        values: '0x16'
      - series: 'fennec_replicas{job="fennecdb-router",instance="r2:8090"}'
        values: '0x16'
      - series: 'fennec_router_following{job="fennecdb-router",instance="r2:8090"}'
        values: '1x16'
      - series: 'fennec_replicas{job="fennecdb-global",instance="g1:8090"}'
        values: '0x16'
      - series: 'fennec_router_following{job="fennecdb-global",instance="g1:8090"}'
        values: '0x16'
    alert_rule_test:
      - eval_time: 14m
        alertname: FennecDirectoryUnreplicated
        exp_alerts:
          - exp_labels: {severity: warning, instance: "r1:8090", job: fennecdb-router}
            exp_annotations:
              summary: "r1:8090 keeps a directory no standby follows"
              runbook: deploy/RUNBOOK.md#a-router-lost

  # A node that stops answering exports nothing: told by Prometheus's `up`.
  - interval: 15s
    input_series:
      - series: 'up{job="fennecdb-node",instance="n1:8081"}'
        values: '1 1 0x10'
      - series: 'up{job="fennecdb-node",instance="n2:8081"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 30s
        alertname: FennecNodeDown
        exp_alerts: []
      - eval_time: 2m
        alertname: FennecNodeDown
        exp_alerts:
          - exp_labels: {severity: critical, instance: "n1:8081", job: fennecdb-node}
            exp_annotations:
              summary: "Node n1:8081 does not answer: its router fails its tenants over as its lease lapses, and its replicas are gone"
              runbook: deploy/RUNBOOK.md#a-node-lost

  # Routers down, told apart by the role their last scrape gave: eu's
  # primary (critical), its standby and the global router's standby
  # (warning, after five minutes), and one never seen up.
  - interval: 15s
    input_series:
      - series: 'up{job="fennecdb-router",instance="r1:8090"}'
        values: '1 1 0x40'
      - series: 'fennec_router_following{job="fennecdb-router",instance="r1:8090"}'
        values: '0 0 _x40'
      - series: 'up{job="fennecdb-router",instance="r2:8090"}'
        values: '1 1 0x40'
      - series: 'fennec_router_following{job="fennecdb-router",instance="r2:8090"}'
        values: '1 1 _x40'
      - series: 'up{job="fennecdb-global",instance="g2:8090"}'
        values: '1 1 0x40'
      - series: 'fennec_router_following{job="fennecdb-global",instance="g2:8090"}'
        values: '1 1 _x40'
      - series: 'up{job="fennecdb-router",instance="r9:8090"}'
        values: '0x42'
    alert_rule_test:
      - eval_time: 2m
        alertname: FennecPrimaryRouterDown
        exp_alerts:
          - exp_labels: {severity: critical, instance: "r1:8090", job: fennecdb-router}
            exp_annotations:
              summary: "Router r1:8090 keeps its directory and does not answer: promote its standby"
              runbook: deploy/RUNBOOK.md#a-router-lost
      - eval_time: 2m
        alertname: FennecStandbyRouterDown
        exp_alerts: []
      - eval_time: 6m
        alertname: FennecStandbyRouterDown
        exp_alerts:
          - exp_labels: {severity: warning, instance: "r2:8090", job: fennecdb-router}
            exp_annotations:
              summary: "Standby router r2:8090 does not answer: its directory has no standby to promote"
              runbook: deploy/RUNBOOK.md#a-router-lost
          - exp_labels: {severity: warning, instance: "g2:8090", job: fennecdb-global}
            exp_annotations:
              summary: "Standby router g2:8090 does not answer: its directory has no standby to promote"
              runbook: deploy/RUNBOOK.md#a-router-lost
      - eval_time: 2m
        alertname: FennecRouterDown
        exp_alerts:
          - exp_labels: {severity: critical, instance: "r9:8090", job: fennecdb-router}
            exp_annotations:
              summary: "Router r9:8090 does not answer, and has not in the hour"
              runbook: deploy/RUNBOOK.md#a-router-lost

  # A job Prometheus scrapes nothing of: the nodes' and the archivers'
  # node_exporter here.
  - interval: 1m
    input_series:
      - series: 'up{job="fennecdb-router",instance="r1:8090"}'
        values: '1x12'
      - series: 'up{job="fennecdb-global",instance="g1:8090"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 11m
        alertname: FennecScrapeMissing
        exp_alerts:
          - exp_labels: {severity: warning, job: fennecdb-node}
            exp_annotations:
              summary: "Prometheus scrapes no target of job fennecdb-node: every alert over it is blind"
              runbook: deploy/RUNBOOK.md#alerts
          - exp_labels: {severity: warning, job: node-exporter}
            exp_annotations:
              summary: "Prometheus scrapes no target of job node-exporter: every alert over it is blind"
              runbook: deploy/RUNBOOK.md#alerts

  # Connections near a ceiling, a node's and a router's.
  - interval: 1m
    input_series:
      - series: 'fennec_connections{job="fennecdb-node",instance="n1:8081"}'
        values: '3500x10'
      - series: 'fennec_connections{job="fennecdb-node",instance="n2:8081"}'
        values: '100x10'
      - series: 'fennec_router_connections{job="fennecdb-router",instance="r1:8090"}'
        values: '900x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: FennecConnectionsNearCeiling
        exp_alerts:
          - exp_labels: {severity: warning, instance: "n1:8081", job: fennecdb-node}
            exp_annotations:
              summary: "n1:8081 holds 3500 connections, near its --max-connections"
              runbook: deploy/RUNBOOK.md#adding-a-node
          - exp_labels: {severity: warning, instance: "r1:8090", job: fennecdb-router}
            exp_annotations:
              summary: "r1:8090 holds 900 connections, near its --max-connections"
              runbook: deploy/RUNBOOK.md#adding-a-node

  # A connection with no thread, a node's and a router's: paged while one
  # is in the last five minutes, and not for the ceiling's refusals nor for
  # a count that stands still, refused long before.
  - interval: 1m
    input_series:
      - series: 'fennec_connections_refused_total{job="fennecdb-node",instance="n1:8081",reason="no_thread"}'
        values: '0 0 1x10'
      - series: 'fennec_connections_refused_total{job="fennecdb-node",instance="n1:8081",reason="ceiling"}'
        values: '0+5x12'
      - series: 'fennec_connections_refused_total{job="fennecdb-node",instance="n2:8081",reason="no_thread"}'
        values: '3x12'
      - series: 'fennec_router_connections_refused_total{job="fennecdb-router",instance="r1:8090",reason="no_thread"}'
        values: '0 0 0 2x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: FennecNoThreadForConnection
        exp_alerts:
          - exp_labels: {severity: critical, instance: "n1:8081"}
            exp_annotations:
              summary: "n1:8081 could make no thread for a connection and refused it 503: it is at its thread limit"
              runbook: deploy/RUNBOOK.md#installing-a-machine
          - exp_labels: {severity: critical, instance: "r1:8090"}
            exp_annotations:
              summary: "r1:8090 could make no thread for a connection and refused it 503: it is at its thread limit"
              runbook: deploy/RUNBOOK.md#installing-a-machine
      - eval_time: 11m
        alertname: FennecNoThreadForConnection
        exp_alerts: []

  # A failover that left a tenant on its node: the review's sequence.
  # eu-a's failover fails at 2m, one tenant left on it, and eu-a answers
  # again at 20m; eu-c is failed over at 30m with a tenant left, failed over
  # by hand at 40m (the runbook's fix) and stays failed over; eu-b is failed
  # over whole at 60m, its tenants promoted within two minutes. Paged for
  # eu-a and eu-c alone, each until its tenants were writable -- the count
  # of failed failovers, which stays 1, paged again at 65m and after the fix.
  - interval: 1m
    input_series:
      - series: 'fennec_router_auto_failovers_total{job="fennecdb-router",instance="r1:8090",outcome="failed"}'
        values: '0 0 1x29 2x69'
      - series: 'fennec_router_auto_failovers_total{job="fennecdb-router",instance="r1:8090",outcome="done"}'
        values: '0x59 1x41'
      - series: 'fennec_router_tenants{job="fennecdb-router",instance="r1:8090",node="eu-a",region="eu"}'
        values: '3 3 1x98'
      - series: 'fennec_router_node_failed_over{job="fennecdb-router",instance="r1:8090",node="eu-a",region="eu"}'
        values: '0 0 1x17 0x80'
      - series: 'fennec_router_tenants{job="fennecdb-router",instance="r1:8090",node="eu-c",region="eu"}'
        values: '1x39 0x60'
      - series: 'fennec_router_node_failed_over{job="fennecdb-router",instance="r1:8090",node="eu-c",region="eu"}'
        values: '0x29 1x70'
      - series: 'fennec_router_tenants{job="fennecdb-router",instance="r1:8090",node="eu-b",region="eu"}'
        values: '2x61 0x38'
      - series: 'fennec_router_node_failed_over{job="fennecdb-router",instance="r1:8090",node="eu-b",region="eu"}'
        values: '0x59 1x40'
    alert_rule_test:
      - eval_time: 3m
        alertname: FennecAutoFailoverIncomplete
        exp_alerts: []
      - eval_time: 10m
        alertname: FennecAutoFailoverIncomplete
        exp_alerts:
          - exp_labels: {severity: critical, instance: "r1:8090", job: fennecdb-router, node: eu-a, region: eu}
            exp_annotations:
              summary: "Node eu-a (eu) was failed over with tenants still placed on it (1): they take no writes"
              runbook: deploy/RUNBOOK.md#a-node-lost
      - eval_time: 25m
        alertname: FennecAutoFailoverIncomplete
        exp_alerts: []
      - eval_time: 35m
        alertname: FennecAutoFailoverIncomplete
        exp_alerts:
          - exp_labels: {severity: critical, instance: "r1:8090", job: fennecdb-router, node: eu-c, region: eu}
            exp_annotations:
              summary: "Node eu-c (eu) was failed over with tenants still placed on it (1): they take no writes"
              runbook: deploy/RUNBOOK.md#a-node-lost
      - eval_time: 45m
        alertname: FennecAutoFailoverIncomplete
        exp_alerts: []
      - eval_time: 65m
        alertname: FennecAutoFailoverIncomplete
        exp_alerts: []

  # A late renewal seen at one scrape is held five minutes (eu-a); the
  # scrapes before a failover marks its node (eu-b), and the five minutes
  # after a failed-over node answers again (eu-c), are not this rule's.
  - interval: 15s
    input_series:
      - series: 'fennec_router_lease_age_seconds{job="fennecdb-router",instance="r1:8090",node="eu-a",region="eu"}'
        values: '0.5 1 4 1 0.5 1x40'
      - series: 'fennec_router_node_failed_over{job="fennecdb-router",instance="r1:8090",node="eu-a",region="eu"}'
        values: '0x45'
      - series: 'fennec_router_lease_age_seconds{job="fennecdb-router",instance="r1:8090",node="eu-b",region="eu"}'
        values: '1 1 4 6 21+15x41'
      - series: 'fennec_router_node_failed_over{job="fennecdb-router",instance="r1:8090",node="eu-b",region="eu"}'
        values: '0 0 0 1x42'
      - series: 'fennec_router_lease_age_seconds{job="fennecdb-router",instance="r1:8090",node="eu-c",region="eu"}'
        values: '1 10+15x8 1x35'
      - series: 'fennec_router_node_failed_over{job="fennecdb-router",instance="r1:8090",node="eu-c",region="eu"}'
        values: '0 1x8 0x35'
    alert_rule_test:
      # eu-b's last scrape before its failover marks it, and eu-a's late one.
      - eval_time: 30s
        alertname: FennecLeaseRenewalLate
        exp_alerts: []
      - eval_time: 1m
        alertname: FennecLeaseRenewalLate
        exp_alerts: []
      - eval_time: 3m
        alertname: FennecLeaseRenewalLate
        exp_alerts:
          - exp_labels: {severity: warning, instance: "r1:8090", job: fennecdb-router, node: eu-a, region: eu}
            exp_annotations:
              summary: "Node eu-a went 4 s without a lease in the last five minutes"
              runbook: deploy/RUNBOOK.md#a-lease-late
      - eval_time: 6m
        alertname: FennecLeaseRenewalLate
        exp_alerts: []
      - eval_time: 8m
        alertname: FennecLeaseRenewalLate
        exp_alerts: []

  # The bucket sync: a run's success written every minute is fresh; one
  # last written at the start is stale past half an hour.
  - interval: 1m
    input_series:
      - series: 'fennec_archive_sync_last_success_timestamp_seconds{job="node-exporter",instance="a1:9100",node="eu-a"}'
        values: '0x40'
      - series: 'fennec_archive_sync_last_success_timestamp_seconds{job="node-exporter",instance="a1:9100",node="eu-b"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 29m
        alertname: FennecArchiveSyncStale
        exp_alerts: []
      - eval_time: 31m
        alertname: FennecArchiveSyncStale
        exp_alerts:
          - exp_labels: {severity: warning, instance: "a1:9100", job: node-exporter, node: eu-a}
            exp_annotations:
              summary: "Node eu-a's archive has not reached the bucket in 1860 s"
              runbook: deploy/RUNBOOK.md#archives-and-restores

  # node_exporter that cannot read a file of its collector says so: a1 for a
  # quarter of an hour, a2 never.
  - interval: 1m
    input_series:
      - series: 'node_textfile_scrape_error{job="node-exporter",instance="a1:9100"}'
        values: '0 1x20'
      - series: 'node_textfile_scrape_error{job="node-exporter",instance="a2:9100"}'
        values: '0x21'
    alert_rule_test:
      - eval_time: 10m
        alertname: FennecTextfileUnread
        exp_alerts: []
      - eval_time: 17m
        alertname: FennecTextfileUnread
        exp_alerts:
          - exp_labels: {severity: warning, instance: "a1:9100", job: node-exporter}
            exp_annotations:
              summary: "node_exporter on a1:9100 cannot read a file of its textfile collector, the archive sync's success perhaps"
              runbook: deploy/RUNBOOK.md#archives-and-restores

  # No sync's success read anywhere for an hour; and none said while one is.
  - interval: 1m
    input_series:
      - series: 'up{job="node-exporter",instance="a1:9100"}'
        values: '1x70'
    alert_rule_test:
      - eval_time: 30m
        alertname: FennecArchiveSyncUnreported
        exp_alerts: []
      - eval_time: 61m
        alertname: FennecArchiveSyncUnreported
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "No archive sync has reported a success to node_exporter in an hour"
              runbook: deploy/RUNBOOK.md#archives-and-restores
  - interval: 1m
    input_series:
      - series: 'fennec_archive_sync_last_success_timestamp_seconds{job="node-exporter",instance="a1:9100",node="eu-a"}'
        values: '0+60x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: FennecArchiveSyncUnreported
        exp_alerts: []

  # A node's copies a failover may promote: two not connected for two
  # minutes, one 5 000 writes behind for five -- and a copy behind for less
  # than its five minutes, or a few writes behind, alerting nothing.
  - interval: 1m
    input_series:
      - series: 'fennec_copies_disconnected{job="fennecdb-node",instance="n2:8081"}'
        values: '0 2 2 2 2 2 2 2'
      - series: 'fennec_copies_disconnected{job="fennecdb-node",instance="n3:8081"}'
        values: '0 0 0 0 0 0 0 0'
      - series: 'fennec_copies_behind{job="fennecdb-node",instance="n2:8081"}'
        values: '0 5000 5000 5000 5000 5000 5000 5000'
      - series: 'fennec_copies_behind{job="fennecdb-node",instance="n3:8081"}'
        values: '0 12 12 12 12 12 12 12'
    alert_rule_test:
      - eval_time: 2m
        alertname: FennecTenantCopiesDisconnected
        exp_alerts: []
      - eval_time: 3m
        alertname: FennecTenantCopiesDisconnected
        exp_alerts:
          - exp_labels: {severity: warning, job: fennecdb-node, instance: "n2:8081"}
            exp_annotations:
              summary: "2 tenant copies on n2:8081 are not connected to their primary: a failover now promotes each where it stands, without what it was not sent"
              runbook: deploy/RUNBOOK.md#a-copy-not-following
      - eval_time: 5m
        alertname: FennecTenantCopiesBehind
        exp_alerts: []
      - eval_time: 6m
        alertname: FennecTenantCopiesBehind
        exp_alerts:
          - exp_labels: {severity: warning, job: fennecdb-node, instance: "n2:8081"}
            exp_annotations:
              summary: "A tenant copy on n2:8081 is 5000 writes behind its primary: a failover now loses them"
              runbook: deploy/RUNBOOK.md#a-copy-not-following
