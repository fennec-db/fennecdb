name: fennecdb_notes
description: Notes kept in a fennecdb file on the device -- full-text and toy vector search, filters, a live list.
publish_to: none
version: 0.2.0

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  fennecdb: ^0.2.0
  fennecdb_flutter: ^0.2.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - schema.fennecql
