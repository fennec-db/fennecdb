[package]
name = "notes"
version = "0.1.0"
edition = "2021"
publish = false

# The engine embedded in the program, from the repository at the release's
# tag (the crates are not on crates.io). CI builds it against this checkout
# instead: examples/run-tests.sh patches the three to their paths.
[dependencies]
fennec-core = { git = "https://github.com/fennec-db/fennecdb", tag = "v0.2.0" }
fennec-ql = { git = "https://github.com/fennec-db/fennecdb", tag = "v0.2.0" }
fennec-abi = { git = "https://github.com/fennec-db/fennecdb", tag = "v0.2.0", default-features = false }

# Not a member of the repository's workspace.
[workspace]
